  overflow: auto;
  padding: 0;
  color: var(--ink);
}
dialog::backdrop {
  background: #0d234a9c;
}
.dialog-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 22px 24px;
  border-bottom: 1px solid var(--line);
}
.dialog-head h2 {
  font-size: 22px;
}
.dialog-head .btn {
  width: 38px;
  min-height: 38px;
  padding: 5px;
}
.dialog-body {
  padding: 24px;
}
.actions {
  display: flex;
  justify-content: flex-end;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  margin-top: 24px;
}
fieldset {
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 14px;
}
legend {
  font-size: 12px;
  font-weight: 650;
}
#notice {
  position: fixed;
  bottom: 24px;
  right: 24px;
  max-width: calc(100vw - 36px);
  background: var(--navy);
  color: white;
  border-radius: 10px;
  padding: 15px 20px;
  font-size: 12px;
  line-height: 1.6;
  box-shadow: 0 5px 25px #102c5030;
  z-index: 50;
}
#notice:empty {
  display: none;
}
.footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 18px;
  flex-wrap: wrap;
  color: var(--muted);
  font-size: 10px;
  margin-top: 30px;
  line-height: 1.6;
}
.skip {
  position: absolute;
  top: -60px;
  left: 10px;
  background: white;
  padding: 10px;
  z-index: 100;
}
.skip:focus {
  top: 10px;
}
.log {
  list-style: none;
  margin: 0;
  padding: 0;
}
.log li {
  padding: 12px 0;
  border-bottom: 1px solid var(--line);
  font-size: 12px;
  line-height: 1.6;
}
.log small {
  display: block;
  color: var(--muted);
  margin-top: 5px;
}
.pill-note {
  font-size: 11px;
  color: var(--muted);
  line-height: 1.6;
}
.site-summary {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 14px;
}
.mini-site {
  padding: 16px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: #fafcfe;
}
.mini-site h3 {
  font-size: 13px;
  margin-bottom: 10px;
}
.mini-site b {
  font-size: 24px;
  letter-spacing: -0.025em;
}
.mini-site small {
  font-size: 10px;
  color: var(--muted);
}
.filter-fields {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 12px;
}
.filter-fields .field {
  margin: 0;
}
::-webkit-scrollbar {
  width: 12px;
  height: 12px;
}
::-webkit-scrollbar-track {
  background: var(--paper);
}
::-webkit-scrollbar-thumb {
  background: #8495a9;
  border: 3px solid var(--paper);
  border-radius: 10px;
}
::-webkit-scrollbar-thumb:hover {
  background: var(--muted);
}
@media (max-width: 1050px) {
  .two {
    grid-template-columns: 1fr;
  }
  .three {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
  .role-inner .identity {
    display: none;
  }
  .role {
    flex: 1;
  }
  .metrics {
    gap: 10px;
  }
  .metric {
    padding: 18px;
  }
  .samplebar {
    margin-inline: 30px;
  }
  .status {
    display: none;
  }
}
@media (max-width: 700px) {
  :root {
    scrollbar-gutter: auto;
  }
  .top-inner {
    min-height: 68px;
    padding: 14px 18px;
  }
  .brand b {
    font-size: 18px;
  }
  .brand small {
    font-size: 8px;
  }
  .top .badge {
    font-size: 9px;
  }
  .role-inner {
    padding: 12px 14px;
  }
  .rolechoices {
    gap: 6px;
  }
  .role {
    padding: 10px 7px;
    justify-content: center;
    text-align: center;
    min-height: 61px;
    font-size: 11px;
  }
  .role svg,
  .role small {
    display: none;
  }
  .role .role-label {
    max-width: 100px;
    line-height: 1.5;
  }
  .samplebar {
    margin: 12px 14px 0;
    padding: 9px 11px;
    font-size: 10px;
    gap: 8px;
  }
  .samplebar .btn {
    font-size: 10px;
    min-width: 45px;
  }
  .navwrap {
    padding: 12px 14px 0;
  }
  .tabs {
    gap: 4px;
    padding-bottom: 10px;
  }
  .tabs a {
    font-size: 11px;
    padding: 9px 10px;
    min-height: 41px;
  }
  .tabs svg {
    width: 17px;
    height: 17px;
  }
  .main {
    padding: 22px 16px 35px;
  }
  .pagehead {
    align-items: flex-start;
    flex-wrap: wrap;
    gap: 14px;
    margin-bottom: 23px;
  }
  .pagehead h1 {
    font-size: 29px;
  }
  .pagehead p {
    font-size: 12px;
  }
  .pagehead .eyebrow {
    font-size: 9px;
  }
  .datebox {
    display: none;
  }
  .metrics {
    grid-template-columns: 1fr 1fr;
    margin: 18px 0;
    gap: 10px;
  }
  .metric {
    padding: 15px;
  }
  .metric label {
    font-size: 10px;
  }
  .metric strong {
    font-size: 28px;
  }
  .metric small {
    font-size: 9px;
  }
  .metric svg {
    width: 16px;
    height: 16px;
  }
  .panel {
    padding: 19px;
  }
  .panel-head {
    flex-wrap: wrap;
  }
  .panel h2 {
    font-size: 21px;
  }
  .dispatch {
    padding: 15px;
    gap: 12px;
    align-items: flex-start;
  }
  .dispatch .round {
    width: 34px;
    height: 34px;
    flex-shrink: 0;
  }
  .dispatch h3 {
    font-size: 14px;
  }
  .dispatch p {
    font-size: 11px;
  }
  .three {
    grid-template-columns: 1fr;
  }
  .card-art {
    height: 95px;
  }
  .card-body {
    padding: 20px;
  }
  .card-body h2 {
    font-size: 23px;
  }
  .card-body p {
    font-size: 13px;
  }
  .card-detail {
    font-size: 12px;
  }
  .card-detail small {
    font-size: 9px;
  }
  .taskline {
    font-size: 15px;
    min-height: 63px;
  }
  .taskline input {
    width: 24px;
    height: 24px;
  }
  .evidence {
    align-items: flex-start;
    flex-wrap: wrap;
  }
  .evidence .btn {
    width: 100%;
    min-height: 46px;
  }
  .btn {
    min-height: 46px;
  }
  .btn.wide {
    min-height: 54px;
  }
  .toolbar {
    gap: 12px;
  }
  .search {
    max-width: none;
    width: 100%;
  }
  .chip {
    font-size: 11px;
    padding: 9px 10px;
  }
  .table-scroll {
    margin-inline: -3px;
  }
  th {
    padding: 11px 8px;
    font-size: 9px;
  }
  td {
    padding: 14px 8px;
    font-size: 11px;
  }
  .table-scroll .btn {
    min-height: 38px;
  }
  .table-scroll .badge {
    font-size: 9px;
  }
  .dialog-head {
    padding: 18px;
  }
  .dialog-body {
    padding: 20px;
  }
  .actions .btn {
    flex: 1;
  }
  .line {
    flex-wrap: wrap;
  }
  .line b {
    max-width: 100%;
    text-align: left;
  }
  .filter-fields {
    grid-template-columns: 1fr;
  }
  .site-summary {
    grid-template-columns: 1fr 1fr;
  }
  .mini-site {
    padding: 12px;
  }
  .mini-site h3 {
    font-size: 12px;
  }
  .mini-site b {
    font-size: 22px;
  }
  .footer {
    font-size: 9px;
  }
  .empty {
    padding: 28px 10px;
  }
}
@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation: none !important;
    transition: none !important;
    scroll-behavior: auto !important;
  }
}
@media (forced-colors: active) {
  :root {
    scrollbar-color: auto;
  }
  .badge,
  .btn,
  .role {
    border: 1px solid ButtonText;
  }
}
@media print {
  .top,
  .rolebar,
  .samplebar,
  .navwrap,
  .btn,
  #notice {
    display: none !important;
  }
  .main {
    padding: 0;
  }
  .panel,
  .metric {
    break-inside: avoid;
  }
}

:root {
  --font-ui: NPISans, "Segoe UI", Arial, sans-serif;
  --font-size: 16px;
  --heading-size: 32px;
  --panel-heading: 21px;
  --sidebar-width: 232px;
  --page-padding: 32px;
  --radius: 12px;
  --blue: #2459a0;
  font-family: var(--font-ui);
  font-size: var(--font-size);
}
body {
  font: 400 16px/1.5 var(--font-ui);
}
h1,
h2,
h3 {
  font-family: var(--font-ui);
  font-weight: 700;
  letter-spacing: -0.025em;
}
h1 {
  font-size: var(--heading-size);
  line-height: 1.2;
}
h2 {
  font-size: var(--panel-heading);
  line-height: 1.3;
}
h3 {
  font-size: 18px;
}
small,
.small {
  font-size: 14px;
}
p {
  line-height: 1.5;
}
.btn {
  font-size: 15px;
  font-weight: 600;
  border-radius: 8px;
  min-height: 44px;
  padding: 10px 15px;
}
.btn:hover:not(:disabled) {
  box-shadow: 0 0 0 1px #6a829b;
}
.btn.primary {
  background: var(--blue);
  border-color: var(--blue);
}
input,
select,
textarea {
  font-size: 16px;
}
b,
strong {
  font-weight: 700;
}
.badge {
  font-size: 13px;
}
.eyebrow {
  font-size: 12px;
  letter-spacing: 1.4px;
}
.mobile-navigation {
  display: none;
}
.reference-sidebar {
  position: fixed;
  inset: 0 auto 0 0;
  width: var(--sidebar-width);
  overflow-y: auto;
  background: #0b1d31;
  color: #b8c9da;
  padding: 24px 12px;
  scrollbar-color: #8196ad #0b1d31;
}
.side-brand {
  display: grid;
  grid-template-columns: 44px 1fr;
  column-gap: 12px;
  align-items: center;
  padding: 0 12px 24px;
  border-bottom: 1px solid #2b3d51;
  text-align: left;
}
.brand-image.sidebar,
.brand-placeholder.sidebar {
  width: 44px;
  height: 44px;
  object-fit: contain;
  grid-row: span 2;
}
.brand-placeholder {
  display: grid;
  place-items: center;
  color: white;
  border: 1px solid #536b86;
  border-radius: 10px;
  background: #163552;
}
.brand-placeholder span {
  font-size: 17px;
  font-weight: 700;
  letter-spacing: 0.03em;
}
.side-brand h2 {
  font-size: 18px;
  letter-spacing: 0.04em;
  color: white;
}
.side-brand p {
  font-size: 10px;
  letter-spacing: 1px;
}
.side-label {
  font-size: 10px;
  letter-spacing: 1.4px;
  margin: 24px 12px 12px;
}
.side-nav {
  display: grid;
  gap: 3px;
}
.side-nav a {
  display: flex;
  align-items: center;
  gap: 11px;
  min-height: 44px;
  padding: 10px 12px;
  color: #b8c9da;
  text-decoration: none;
  font-size: 15px;
  font-weight: 600;
  border-left: 3px solid transparent;
  border-radius: 7px;
}
.side-nav a:hover {
  background: #18354f;
  color: white;
}
.side-nav a[aria-current] {
  background: #24466a;
  color: white;
  border-left-color: #dabb72;
}
.side-nav svg {
  width: 18px;
  height: 18px;
}
.side-count {
  margin-left: auto;
  font-size: 12px;
  border-radius: 5px;
  background: #e6eef8;
  color: #1a3657;
  padding: 2px 7px;
}
.side-bottom {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 24px 8px 0;
  border-top: 1px solid #2b3d51;
  padding-top: 18px;
  font-size: 13px;
}
.side-bottom p {
  font-size: 12px;
}
.side-bottom .btn {
  padding: 8px;
  color: white;
}
.reference-workspace {
  margin-left: var(--sidebar-width);
}
.reference-topbar {
  min-height: 80px;
  padding: 16px var(--page-padding);
  background: white;
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;

function recordedHours(work) {
  const total = (work.sessions || []).reduce((sum, s) => {
    if (!s.out || !s.in || !s.out.time || !s.in.time) return sum;
    const raw = (Date.parse(s.out.time) - Date.parse(s.in.time)) / 3600000;
    if (!Number.isFinite(raw) || raw < 0) throw Error("Invalid interval");
    const net = raw - (s.breakMinutes || 0) / 60;
    if (net < 0) throw Error("Break exceeds interval");
    return sum + net * (s.members?.length || 1);
  }, 0);
  return Math.round(total * 10000) / 10000;
}
function hasBothLocations(work) {
  return (
    !!work.sessions?.length &&
    work.sessions.every((s) =>
      [s.in, s.out].every(
        (e) =>
          e &&
          Number.isFinite(e.lat) &&
          Number.isFinite(e.lng) &&
          e.lat >= -90 &&
          e.lat <= 90 &&
          e.lng >= -180 &&
          e.lng <= 180 &&
          e.time,
      ),
    )
  );
}
function quantity(work, basis) {
  if (work.status !== "approved" || !hasBothLocations(work))
    throw Error("NPI approval and both locations required");
  const units = {
    hourly: work.acceptedHours,
    visit: 1,
    load: work.loads,
    fixed: 1,
  }[basis];
  if (!Number.isFinite(units) || units < 0) throw Error("Invalid units");
  return units;
}
function charge(work, side) {
  const rate = work.rates[side];
  if (!rate || !Number.isInteger(rate.cents) || rate.cents < 0)
    throw Error("Invalid rate");
  const total = Math.round(quantity(work, rate.basis) * rate.cents);
  if (!Number.isSafeInteger(total)) throw Error("Amount exceeds safe limits");
  return total;
}
function eligible(works, documents) {
  const allocated = new Set(documents.flatMap((d) => d.workIds));
  return works.filter(
    (w) =>
      w.status === "approved" && hasBothLocations(w) && !allocated.has(w.id),
  );
}
function approveHours(work, accepted, reason) {
  if (work.status !== "npi-review")
    throw Error("Subcontractor approval must come first");
  if (!hasBothLocations(work))
    throw Error("Check-in and checkout locations are required");
  if (!Number.isFinite(accepted) || accepted < 0 || accepted > 10000)
    throw Error("Invalid accepted hours");
  if (Math.abs(accepted - work.claimedHours) > 0.0001 && !reason?.trim())
    throw Error("Explain the change to claimed hours");
  return {
    ...work,
    status: "approved",
    acceptedHours: accepted,
    npiReason: reason || "",
  };
}

function overlappingWorkers(work, allWorks) {
  const overlap = new Set();
  for (const own of work.sessions || []) {
    if (!own.out) continue;
    for (const other of allWorks.filter((w) => w.id !== work.id))
      for (const s of other.sessions || []) {
        if (!s.out) continue;
        if (
          Date.parse(own.in.time) < Date.parse(s.out.time) &&
          Date.parse(s.in.time) < Date.parse(own.out.time)
        ) {
          for (const id of own.members || [])
            if (s.members?.includes(id)) overlap.add(id);
        }
      }
  }
  return [...overlap];
}

// Pure workbook boundary: planning fields only; attendance and approvals are immutable.
const workbookHeaders = [
  "work_id",
  "revision",
  "company_id",
  "status",
  "recorded_hours",
  "claimed_hours",
  "accepted_hours",
  "title",
  "planned_date",
  "equipment",
];
const safeCell = (value) => {
  const s = String(value ?? "");
  return (
    '"' + (/^[\s]*[=+@-]/.test(s) ? "'" + s : s).replaceAll('"', '""') + '"'
  );
};
function csvText(rows) {
  return "\ufeff" + rows.map((row) => row.map(safeCell).join(",")).join("\r\n");
}
function parseCsv(text) {
  if (typeof text !== "string" || text.length > 100000)
    throw Error("Use a CSV file smaller than 100 KB.");
  text = text.replace(/^\ufeff/, "");
  const rows = [];
  let row = [],
    cell = "",
    quoted = false,
    closed = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (quoted) {
      if (c === '"') {
        if (text[i + 1] === '"') {
          cell += '"';
          i++;
        } else {
          quoted = false;
          closed = true;
        }
      } else cell += c;
      continue;
    }
    if (c === '"') {
      if (cell || closed) throw Error("Invalid CSV quotation.");
      quoted = true;
    } else if (c === ",") {
      row.push(cell);
      cell = "";
      closed = false;
    } else if (c === "\n" || c === "\r") {
      if (c === "\r" && text[i + 1] === "\n") i++;
      row.push(cell);
      if (row.some((x) => x !== "")) rows.push(row);
      row = [];
      cell = "";
      closed = false;
    } else {
      if (closed) throw Error("Unexpected text after a quoted CSV value.");
      cell += c;
    }
  }
  if (quoted) throw Error("Close the quoted CSV value.");
  row.push(cell);
  if (row.some((x) => x !== "")) rows.push(row);
  if (rows.length < 2 || rows.length > 21)
    throw Error("Include a header and 1–20 work rows.");
  return rows;
}
function workbookRows(state, hours) {
  return [
    workbookHeaders,
    ...state.jobs.map((j) => [
      j.id,
      state.revision,
      j.company,
      j.status,
      hours(j).toFixed(2),
      j.claimedHours === undefined ? "" : Number(j.claimedHours).toFixed(2),
      j.acceptedHours === undefined ? "" : Number(j.acceptedHours).toFixed(2),
      j.title,
      j.date,
      j.equipment,
    ]),
  ];
}
function previewWorkbook(text, state, hours) {
  const rows = parseCsv(text);
  if (JSON.stringify(rows[0]) !== JSON.stringify(workbookHeaders))
    throw Error("Keep the exported column names and order unchanged.");
  const current = new Map(
    workbookRows(state, hours)
      .slice(1)
      .map((r) => [r[0], r.map(String)]),
  );
  const seen = new Set(),
    changes = [];
  for (const row of rows.slice(1)) {
    if (row.length !== workbookHeaders.length)
      throw Error("Every row must have the exported number of columns.");
    const [id, revision] = row;
    if (seen.has(id)) throw Error("Duplicate work ID: " + id);
    seen.add(id);
    const old = current.get(id),
      j = state.jobs.find((j) => j.id === id);
    if (!old) throw Error("Unknown work ID: " + id);
    if (revision !== String(state.revision))
      throw Error(
        "This workbook is stale. Export a fresh copy; no changes were applied.",
      );
    if (row.slice(2, 7).some((value, i) => value !== old[i + 2]))
      throw Error("Company, status and hour totals are protected: " + id);
    if (row.slice(7).every((v, i) => v === old[i + 7])) continue;
    if (j.status !== "draft" || j.sessions.length)
      throw Error(
        "Only unstarted assignments can be edited from the workbook: " + id,
      );
    const [title, date, equipment] = row.slice(7);
    if (!title.trim() || title.length > 150 || equipment.length > 150)
      throw Error(
        "Use a work title and keep planning text within 150 characters.",
      );
    if (
      !/^\d{4}-\d{2}-\d{2}$/.test(date) ||
      !Number.isFinite(Date.parse(date + "T12:00:00Z")) ||
      new Date(date + "T12:00:00Z").toISOString().slice(0, 10) !== date
    )
      throw Error("Use a valid planned date in YYYY-MM-DD format.");
    if ([title, equipment].some((v) => /^[\s]*[=+@-]/.test(v)))
      throw Error("Formula-like planning values are not accepted.");
    changes.push({
      id,
      title: title.trim(),
      date,
      equipment: equipment.trim(),
      before: { title: j.title, date: j.date, equipment: j.equipment },
    });
  }
  return { revision: state.revision, changes };
}

// Decimal prices are stored as integer cents. No real rates are seeded.
function validateRate(input, existing = [], ignoreId = null) {
  const errors = {};
  if (!["customer", "subcontractor"].includes(input.side))
    errors["rate-side"] = "Choose the price list.";
  if (!input.site) errors["rate-site"] = "Choose a location.";
  if (!input.task?.trim())
    errors["rate-task"] = "Enter the task or service name.";
  if (!["hourly", "fixed", "per-visit", "per-load"].includes(input.basis))
    errors["rate-basis"] = "Choose a billing unit.";
  if (input.side === "subcontractor" && !input.company)
    errors["rate-company"] = "Choose the subcontractor.";
  const amount = String(input.amount).trim();
  if (!/^\d{1,7}(\.\d{1,2})?$/.test(amount))
    errors["rate-amount"] =
      "Enter a price from 0 to 9,999,999.99 with at most two decimals.";
  const validDate = (v) =>
    /^\d{4}-\d{2}-\d{2}$/.test(v || "") &&
    Number.isFinite(Date.parse(v + "T12:00:00Z")) &&
    new Date(v + "T12:00:00Z").toISOString().slice(0, 10) === v;
  if (!validDate(input.from))
    errors["rate-from"] = "Choose a valid start date.";
  if (input.to && (!validDate(input.to) || input.to < input.from))
    errors["rate-to"] = "End date must be on or after the start date.";
  if (
    !Object.keys(errors).length &&
    existing.some(
      (r) =>
        r.id !== ignoreId &&
        r.side === input.side &&
        r.site === input.site &&
        r.task.trim().toLowerCase() === input.task.trim().toLowerCase() &&
        r.basis === input.basis &&
        (r.company || "") ===
          (input.side === "customer" ? "" : input.company) &&
        r.from <= (input.to || "9999-12-31") &&
        input.from <= (r.to || "9999-12-31"),
    )
  )
    errors["rate-from"] =
      "These dates overlap another rate for this location, task and price list. Adjust the effective dates.";
  const cents = /^\d{1,7}(\.\d{1,2})?$/.test(amount)
    ? Number(amount.split(".")[0]) * 100 +
      Number((amount.split(".")[1] || "").padEnd(2, "0"))
    : 0;
  return { errors, cents };
}
function pricePreview(rate, quantity) {
  const value = String(quantity).trim();
  if (!/^\d{1,7}(\.\d{1,4})?$/.test(value) || Number(value) <= 0)
    throw Error("Enter a positive quantity with at most four decimals.");
  if (
    ["per-load", "per-visit"].includes(rate.basis) &&
    !Number.isInteger(Number(value))
  )
    throw Error("Loads and visits must be whole numbers.");
  if (rate.basis === "fixed" && Number(value) !== 1)
    throw Error("Use quantity 1 for a fixed service.");
  const scaled =
    Number(value.split(".")[0]) * 10000 +
    Number((value.split(".")[1] || "").padEnd(4, "0"));
  const total = (BigInt(rate.cents) * BigInt(scaled) + 5000n) / 10000n;
  if (total > BigInt(Number.MAX_SAFE_INTEGER))
    throw Error("This amount is too large.");
  return Number(total);
}

function save(fn, text = "Saved on this device.") {
  if (conflict) {
    notice("Another tab changed this sample. Reload before saving.");
    return false;
  }
  try {
    const current = JSON.parse(localStorage.getItem(KEY) || "null");
    if (current && current.revision !== state.revision) {
      conflict = true;
      notice("The sample changed in another tab. Reload before saving.");
      return false;
    }
    const next = structuredClone(state);
    fn(next);
    next.revision++;
    localStorage.setItem(KEY, JSON.stringify(next));
    state = next;
    dirty = false;
    notice(text);
    return true;
  } catch {
    notice(
      "Could not save on this device. Your current input is still on screen. Free browser storage and retry.",
    );
    return false;
  }
}

    Math.floor(seconds / 60) % 60,

    .map((x) => String(x).padStart(2, "0"))

}

const artworkCache = new Map();
const artworkSource = (value) =>
  typeof value === "string" && value.startsWith("npi-artwork:")
    ? artworkCache.get(value) || ""
    : value || "";
const readImageData = (blob) =>
  new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(String(r.result));
    r.onerror = () => reject(Error("Could not read that image."));
    r.readAsDataURL(blob);
  });
function artworkDb() {
  return new Promise((resolve, reject) => {
    const request = indexedDB.open("npi-three-view-artwork", 1);
    request.onupgradeneeded = () => request.result.createObjectStore("images");
    request.onsuccess = () => resolve(request.result);
    request.onerror = () =>
      reject(
        Error(
          "Image storage is unavailable. Try a normal browser window or a smaller image.",
        ),
      );
  });
}
async function artworkOperation(mode, key, blob) {
  const db = await artworkDb();
  try {
    return await new Promise((resolve, reject) => {
      const tx = db.transaction("images", mode),
        store = tx.objectStore("images"),
        request = mode === "readwrite" ? store.put(blob, key) : store.get(key);
      let result;
      request.onsuccess = () => {
        result = request.result;
      };
      tx.oncomplete = () => resolve(result);
      tx.onerror = () =>
        reject(
          Error("Could not save image storage. Free browser space and retry."),
        );
      tx.onabort = () => reject(Error("Image storage was interrupted."));
    });
  } finally {
    db.close();
  }
}
async function persistArtworkBlob(file) {
  const data = await readImageData(file);
  if (file.size <= 600000) return data;
  const key =
    "npi-artwork:" +
    Date.now().toString(36) +
    "-" +
    Math.random().toString(36).slice(2);
  await artworkOperation("readwrite", key, file);
  artworkCache.set(key, data);
  return key;
}
async function loadArtwork() {
  const embedded = JSON.parse(
    document.querySelector("#npi-sample-assets")?.textContent || "null",
  );
  const valid = (data) =>
    typeof data === "string" &&
    data.length < 12000000 &&
    /^data:image\/(png|jpeg|webp);base64,/.test(data);
  const apply = async (target, data) => {
    if (!valid(data)) return;
    const split = data.indexOf(","),
      bytes = Uint8Array.from(atob(data.slice(split + 1)), (c) =>
        c.charCodeAt(0),
      ),
      blob = new Blob([bytes], { type: data.slice(5, data.indexOf(";")) });
    const ref = await persistArtworkBlob(blob);
    if (target === "logo") state.brandLogo = ref;
    else state.sites.find((s) => s.id === target).photo = ref;
  };
  if (embedded) {
    if (!state.brandLogo) await apply("logo", embedded.logo);
    for (const s of state.sites)
      if (!s.photo) await apply(s.id, embedded.sites?.[s.id]);
  }
  const refs = [state.brandLogo, ...state.sites.map((s) => s.photo)].filter(
    (r) => typeof r === "string" && r.startsWith("npi-artwork:"),
  );
  for (const ref of refs) {
    if (artworkCache.has(ref)) continue;
    const blob = await artworkOperation("readonly", ref);
    if (blob) artworkCache.set(ref, await readImageData(blob));
  }
}

async function receivePastedImage(file) {
  const target = pasteTarget,
    generation = ++pasteGeneration;
  if (
    !dlg.open ||
    (!state.sites.some((s) => s.id === target) && target !== "logo")
  )
    return;
  if (
    !file ||
    !["image/png", "image/jpeg", "image/webp"].includes(file.type) ||
    file.size > 8000000
  ) {
    fail(
      "Choose a PNG, JPG or WebP up to 8 MB. Copy the image itself, not its web address.",
    );
    return;
  }
  const zone = $("#image-paste-zone");
  zone.setAttribute("aria-busy", "true");
  try {
    const reference = await persistArtworkBlob(file);
    if (!dlg.open || pasteTarget !== target || pasteGeneration !== generation)
      return;
    if (
      save(
        (n) => {
          if (target === "logo") n.brandLogo = reference;
          else n.sites.find((s) => s.id === target).photo = reference;
        },
        target === "logo"
          ? "Original logo saved unchanged."
          : "Site photo saved unchanged.",
      )
    ) {
      pasteTarget = null;
      close(true);
      render();
    }
  } catch (error) {
    if (dlg.open && pasteTarget === target) fail(error.message);
  } finally {
    zone.removeAttribute("aria-busy");
  }
}

      new Blob([csvText(rows)], { type: "text/csv;charset=utf-8" }),
    ),
    a = document.createElement("a");
  a.href = url;
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function quantityDoc(invoice, existing) {

  const allocated = new Set(
    (invoice ? state.invoices : state.bills)
      .filter((d) => d.id !== existing?.id)
      .flatMap((d) => d.jobIds),
  );
  const list = visible().filter(
    (j) =>
      j.status === "approved" &&
      hasBothLocations(j) &&
      !allocated.has(j.id) &&
      (invoice || j.company === "north"),
  );
  if (!list.length) {
    notice("No unallocated NPI-approved work is available.");
    return;
  }
  modal(
    invoice ? "Customer invoice checklist" : "Subcontractor quantity claim",
    `<form id="document-form" data-kind="${invoice ? "invoice" : "bill"}" data-id="${existing?.id || ""}" novalidate><p class="notice">This records approved work quantities and a reference only. No prices, financial amounts or contract files are included.</p><div class="mt">${list.map((j) => `<label class="taskline"><input type="checkbox" name="bill-job" value="${j.id}" ${existing ? (existing.jobIds.includes(j.id) ? "checked" : "") : "checked"}><span>${j.id} · ${escape(site(j.site).name)}<br><small>${h(j.acceptedHours)} accepted worker-h · ${j.loads} loads · ${escape(basisName(invoice ? j.customerBasis : j.contractorBasis))}</small></span></label>`).join("")}</div><div class="mt">${field("doc-reference", "Your document reference", "text", existing?.reference || "")}</div><div class="actions">${btn("Cancel", "close")}<button type="submit" class="btn primary">${invoice ? "Create unpriced draft" : "Submit quantity claim"}</button></div></form>`,

  gps: () => {
    if (!capture || busy) return;
    if (!navigator.geolocation) {
      fail(
        "Location is unavailable in this browser. Use a supported secure browser context.",
      );
      return;
    }
    const token = capture.token;
    busy = true;
    capture.point = null;
    $("[data-action=capture-confirm]", dlg).disabled = true;
    $("[data-action=example-gps]", dlg).disabled = true;
    $("[data-action=gps]", dlg).disabled = true;
    $("#capture-state").innerHTML =
      '<p role="status">Waiting for device location… Allow location if prompted.</p>';
    navigator.geolocation.getCurrentPosition(
      (p) => {
        busy = false;
        if (capture?.token !== token) return;
        $("[data-action=gps]", dlg).disabled = false;
        $("[data-action=example-gps]", dlg).disabled = false;
        setPoint({
          lat: p.coords.latitude,
          lng: p.coords.longitude,
          accuracy: p.coords.accuracy,
          time: new Date().toISOString(),
          positionTime: new Date(p.timestamp).toISOString(),
          source: "Browser GPS",
          address:
            "Address lookup unavailable. Open the captured coordinates on the map.",
        });
      },
      (e) => {
        busy = false;
        if (capture?.token !== token) return;
        capture.point = null;
        $("[data-action=gps]", dlg).disabled = false;
        $("[data-action=example-gps]", dlg).disabled = false;
        $("[data-action=capture-confirm]", dlg).disabled = true;
        $("#capture-state").innerHTML =
          `<p class="notice error" role="alert">${e.code === 1 ? "Location permission denied. Allow it in browser settings and retry." : e.code === 3 ? "Location timed out. Check location settings and retry." : "Location could not be obtained. Check your device and retry."} No attendance event was recorded.</p>`;
      },
      { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 },
    );
  },
  "example-gps": () => {
    if (!capture || busy) return;
    const j = job(capture.id),
      open = j.sessions.find((s) => !s.out);
    const t = capture.out
      ? new Date(Date.parse(open.in.time) + 2 * 3600000).toISOString()
      : new Date().toISOString();
    setPoint(point(t));
  },
  "capture-confirm": () => {
    if (busy || !capture?.point) return;
    const { id, out, point: p } = capture,
      j = job(id);
    if (
      p.source === "Browser GPS" &&
      Date.now() - Date.parse(p.positionTime) > 120000
    ) {
      fail("This location is too old. Get a fresh device position.");
      return;
    }
    let members = ["alex"],
      breakMinutes = 0;
    if (out) {
      const open = j.sessions.find((s) => !s.out);
      breakMinutes = Number($("#break").value);
      const elapsed = (Date.parse(p.time) - Date.parse(open.in.time)) / 60000;
      if (
        !Number.isFinite(breakMinutes) ||
        breakMinutes < 0 ||
        breakMinutes > elapsed
      ) {
        validate({
          break:
            "Break minutes must be between zero and this interval’s elapsed minutes.",
        });
        return;
      }
    } else {
      if ($("#mode").value === "crew")
        members = [...dlg.querySelectorAll("input[name=crew]:checked")].map(
          (x) => x.value,
        );
      if (!members.length || !members.includes("alex")) {
        fail(
          "Include Alex, the device operator, and each crew member who is present.",
        );
        return;
      }
      if (
        state.jobs.some((x) =>
          x.sessions.some(
            (s) => !s.out && s.members.some((id) => members.includes(id)),
          ),
        )
      ) {
        fail(
          "One or more selected workers already have an open attendance interval. Check out of it first.",
        );
        return;
      }
    }
    if (
      save(
        (n) => {
          const x = n.jobs.find((j) => j.id === id);
          if (out) {
            const s = x.sessions.find((s) => !s.out);
            s.out = p;
            s.breakMinutes = breakMinutes;
          } else {
            x.sessions.push({
              in: p,
              out: null,
              members,
              operator: "alex",
              breakMinutes: 0,
            });
            x.status = "in-progress";
          }
          n.audit.unshift({
            text: `${id}: ${out ? "checkout" : "check-in"} recorded with ${p.source}.`,
            company: x.company,
            actor: roles[role].name,
            at: new Date().toISOString(),
          });
        },
        `${out ? "Checkout" : "Check-in"} saved locally with its own location.`,
      )
    ) {
      close(true);
      render();
    }
  },

function submit(e) {
  e.preventDefault();
  const f = e.target,
    id = f.dataset.id,
    j = job(id),
    value = (k) => $("#" + k, f)?.value.trim() || "";
  try {
    if (f.id === "workspace-form") {
      if (role !== "npi") return;
      if (
        !validate(
          value("workspace-name")
            ? {}
            : { "workspace-name": "Enter the workspace name." },
        )
      )
        return;
      if (
        save((n) => {
          n.workspace = {
            name: value("workspace-name"),
            note: value("workspace-note"),
          };
        }, "Workspace saved locally.")
      ) {
        close(true);
        render();
      }
      return;
    }
    if (f.id === "rate-form") {
      if (role !== "npi") return;
      const input = {
        side: value("rate-side"),
        company: value("rate-company"),
        site: value("rate-site"),
        task: value("rate-task"),
        basis: value("rate-basis"),
        amount: value("rate-amount"),
        from: value("rate-from"),
        to: value("rate-to"),
      };
      const check = validateRate(input, state.rates || [], id || null);
      if (!state.sites.some((s) => s.id === input.site))
        check.errors["rate-site"] = "Choose an existing location.";
      if (
        input.side === "subcontractor" &&
        !state.companies.some((c) => c.id === input.company)
      )
        check.errors["rate-company"] = "Choose an existing company.";
      if (!validate(check.errors)) return;
      if (!id && (state.rates || []).length >= 100) {
        fail("This local package supports 100 rate entries.");
        return;
      }
      if (
        save((n) => {
          n.rates ||= [];
          const previous = n.rates.find((r) => r.id === id);
          const next = {
            id: previous?.id || "RATE-" + Date.now(),
            side: input.side,
            company: input.side === "customer" ? "" : input.company,
            site: input.site,
            task: input.task.trim(),
            basis: input.basis,
            cents: check.cents,
            currency: "USD",
            from: input.from,
            to: input.to,
            version: (previous?.version || 0) + 1,
          };
          if (previous) n.rates[n.rates.indexOf(previous)] = next;
          else n.rates.push(next);
          n.audit.unshift({
            text: `${next.id}: rate settings saved (version ${next.version}); no work or invoice changed.`,
            company: "npi",
            actor: "NPI Admin",
            at: new Date().toISOString(),
          });
        }, "Rate saved on this device. No invoice changed.")
      ) {
        close(true);
        render();
      }
      return;
    }
    if (f.id === "rate-calculator") {
      if (role !== "npi") return;
      const r = (state.rates || []).find((x) => x.id === id);
      if (!r) return;
      try {
        const total = pricePreview(r, value("rate-quantity"));
        if (!validate({})) return;
        $("#rate-total").textContent =
          "Subtotal: " + money(total) + " USD · excludes tax";
        dirty = false;
      } catch (e) {
        validate({ "rate-quantity": e.message });
      }
      return;
    }
    if (f.id === "plan-form") {
      if (
        role === "worker" ||
        !visible().some((x) => x.id === j?.id) ||
        j.status !== "draft" ||
        j.sessions.length
      )
        throw Error("Only an unstarted assignment can be planned.");
      const errors = {};
      if (!value("plan-title")) errors["plan-title"] = "Describe the work.";
      const d = value("plan-date");
      if (
        !/^\d{4}-\d{2}-\d{2}$/.test(d) ||
        !Number.isFinite(Date.parse(d + "T12:00:00Z"))
      )
        errors["plan-date"] = "Choose a valid planned date.";
      if (!validate(errors)) return;
      if (
        save((n) => {
          const x = n.jobs.find((x) => x.id === id);
          x.title = value("plan-title");
          x.date = d;
          x.equipment = value("plan-equipment") || "To be confirmed";
          n.audit.unshift({
            text: `${id}: assignment plan updated.`,
            company: x.company,
            actor: roles[role].name,
            at: new Date().toISOString(),
          });
        }, "Assignment plan saved locally.")
      ) {
        close(true);
        render();
      }
      return;
    }
    if (f.id === "assign-worker-form") {
      const p = person(value("assign-person"));
      if (
        role !== "sub" ||
        j.company !== "north" ||
        j.status !== "draft" ||
        j.sessions.length ||
        !p?.active ||
        p.company !== j.company
      )
        throw Error(
          "Only an active worker in your company can be assigned before attendance begins.",
        );
      if (
        save((n) => {
          n.jobs.find((x) => x.id === id).worker = p.id;
          n.audit.unshift({
            text: `${id}: company assigned ${p.name}.`,
            company: j.company,
            actor: roles[role].name,
            at: new Date().toISOString(),
          });
        }, "Company assignment saved locally.")
      ) {
        close(true);
        render();
      }
    }
    if (f.id === "request-form") {
      if (
        !validate(
          value("request-description")
            ? {}
            : { "request-description": "Describe the additional work." },
        )
      )
        return;
      if (
        save((n) => {
          (n.requests ||= []).push({
            id: "REQUEST-" + Date.now(),
            site: value("request-site"),
            description: value("request-description"),
            company: "north",
          });
        }, "Sample request saved locally.")
      ) {
        close(true);
        render();
      }
    }
    if (f.id === "job-form") {
      if (role !== "npi") return;
      if (state.jobs.length >= 20)
        throw Error("The sample is limited to 20 work records.");
      const errors = {};
      if (!value("job-title")) errors["job-title"] = "Describe the work.";
      if (person(value("job-worker")).company !== value("job-company"))
        errors["job-worker"] = "Choose a worker from the selected company.";
      if (!value("job-date")) errors["job-date"] = "Choose a planned date.";
      const selectedSite = site(value("job-site"));
      if (
        (selectedSite.family === "hauling") !==
        (value("job-service") === "Hauling")
      )
        errors["job-service"] =
          "Choose hauling for the port, or a site service for a courthouse.";
      if (!validate(errors)) return;
      if (
        save((n) => {
          const id =
            "DEMO-" +
            (Math.max(...n.jobs.map((j) => Number(j.id.slice(5)))) + 1);
          n.jobs.unshift({
            id,
            site: selectedSite.id,
            family: selectedSite.family,
            service: value("job-service"),
            title: value("job-title"),
            company: value("job-company"),
            worker: value("job-worker"),
            equipment: value("job-equipment") || "To be confirmed",
            date: value("job-date"),
            customerBasis: value("customer-basis"),
            contractorBasis: value("contractor-basis"),
            status: "draft",
            sessions: [],
            tasks: [],
            photos: [],
            timecard: null,
            loads: 0,
            claimedBy: {},
            acceptedBy: {},
          });
          if (f.dataset.request) {
            const request = n.requests?.find((r) => r.id === f.dataset.request);
            if (request) request.jobId = id;
          }
          n.audit.unshift({
            text: `${id}: sample assignment created.`,
            company: value("job-company"),
            actor: roles[role].name,
            at: new Date().toISOString(),
          });
        }, "Sample assignment created.")
      ) {
        close(true);
        go("orders");
      }
    }
    if (f.id === "claim-form") {
      const by = {},
        errors = {};
      for (const id of roster(j)) {
        by[id] = Number(value("claim-" + id));
        if (!Number.isFinite(by[id]) || by[id] < 0 || by[id] > 10000)
          errors["claim-" + id] = "Enter valid nonnegative hours.";
      }
      const total = Object.values(by).reduce((a, b) => a + b, 0);
      if (Math.abs(total - recordedHours(j)) > 0.0001 && !value("claim-note"))
        errors["claim-note"] =
          "Explain why the claim differs from recorded attendance.";
      if (!validate(errors)) return;
      if (
        save((n) => {
          const x = n.jobs.find((j) => j.id === id);
          x.claimedBy = by;
          x.claimedHours = total;
          x.note = value("claim-note");
          x.status = "contractor-review";
          x.acceptedBy = {};
          delete x.acceptedHours;
          n.audit.unshift({
            text: `${id}: worker sent ${h(total)} claimed hours to company review.`,
            company: x.company,
            actor: roles[role].name,
            at: new Date().toISOString(),
          });
        }, "Claim sent to Subcontractor Admin.")
      ) {
        close(true);
        render();
      }
    }
    if (f.id === "verify-form") {
      if (role !== "npi") return;
      const by = {},
        errors = {};
      for (const id of roster(j)) {
        by[id] = Number(value("accept-" + id));
        if (!Number.isFinite(by[id]) || by[id] < 0 || by[id] > 10000)
          errors["accept-" + id] = "Enter valid nonnegative hours.";
      }
      if (
        Object.keys(by).some(
          (id) => Math.abs(by[id] - j.claimedBy[id]) > 0.0001,
        ) &&
        !value("verify-note")
      )
        errors["verify-note"] = "Explain the adjustment to claimed hours.";
      if (!validate(errors)) return;
      if (overlappingWorkers(j, state.jobs).length)
        throw Error(
          "Overlapping attendance must be resolved before acceptance.",
        );
      const total = Object.values(by).reduce((a, b) => a + b, 0),
        approved = approveHours(j, total, value("verify-note"));
      if (
        save((n) => {
          n.jobs[n.jobs.findIndex((j) => j.id === id)] = {
            ...approved,
            acceptedBy: by,
          };
          n.audit.unshift({
            text: `${id}: NPI accepted ${h(total)} hours. ${value("verify-note")}`,
            company: j.company,
            actor: roles[role].name,
            at: new Date().toISOString(),
          });
        }, "Verified hours accepted. Original attendance and claim retained.")
      ) {
        close(true);
        render();
      }
    }
    if (f.id === "return-form") {
      if (
        !validate(
          value("correction")
            ? {}
            : { correction: "Give the worker a clear correction reason." },
        )
      )
        return;
      if (
        save((n) => {
          const x = n.jobs.find((j) => j.id === id);
          x.status = "returned";
          x.returnReason = value("correction");
          n.audit.unshift({
            text: `${id}: correction requested: ${value("correction")}`,
            company: x.company,
            actor: roles[role].name,
            at: new Date().toISOString(),
          });
        }, "Returned to the worker. Resubmission passes through both review stages again.")
      ) {
        close(true);
        render();
      }
    }
    if (f.id === "loads-form") {
      const count = Number(value("load-count"));
      if (
        !validate(
          Number.isInteger(count) && count >= 0 && count <= 9999
            ? {}
            : { "load-count": "Enter a whole load count from 0 to 9,999." },
        )
      )
        return;
      if (
        save(
          (n) => (n.jobs.find((j) => j.id === id).loads = count),
          "Load count saved locally.",
        )
      ) {
        close(true);
        render();
      }
    }
    if (f.id === "person-form") {
      const name = value("person-name"),
        username = value("person-username"),
        errors = {};
      if (!name) errors["person-name"] = "Enter a worker name.";
      if (!/^[a-zA-Z0-9._-]{3,32}$/.test(username))
        errors["person-username"] =
          "Use 3–32 letters, numbers, dots, underscores or hyphens.";
      if (
        state.people.some(
          (p) => p.username.toLowerCase() === username.toLowerCase(),
        )
      )
        errors["person-username"] = "That sample username is already used.";
      if (!validate(errors)) return;
      if (
        save(
          (n) =>
            n.people.push({
              id: "person-" + Date.now(),
              name,
              username,
              company: "north",
              active: true,
            }),
          "Sample profile saved. No login account was created.",
        )
      ) {
        close(true);
        render();
      }
    }
    if (f.id === "site-form") {
      if (
        save(
          (n) =>
            (n.sites.find((s) => s.id === id).address = value("site-address")),
          "Site address saved only in this sample.",
        )
      ) {
        close(true);
        render();
      }
    }
    if (f.id === "document-form") {
      const invoice = f.dataset.kind === "invoice",
        docs = invoice ? state.invoices : state.bills,
        existing = docs.find((d) => d.id === id),
        ids = [...f.querySelectorAll("input[name=bill-job]:checked")].map(
          (x) => x.value,
        ),
        ref = value("doc-reference"),
        errors = {};
      if (!ref) errors["doc-reference"] = "Enter a reference.";
      if (
        docs.some(
          (d) => d.id !== id && d.reference.toLowerCase() === ref.toLowerCase(),
        )
      )
        errors["doc-reference"] = "That reference is already used.";
      if (!validate(errors)) return;
      if (!ids.length) {
        fail("Select at least one approved work record.");
        return;
      }
      const allocated = new Set(
        docs.filter((d) => d.id !== id).flatMap((d) => d.jobIds),
      );
      if (
        ids.some(
          (id) =>
            allocated.has(id) ||
            job(id).status !== "approved" ||
            !hasBothLocations(job(id)) ||
            (!invoice && job(id).company !== "north"),
        )
      )
        throw Error(
          "Only unallocated, permitted, NPI-approved work can be included.",
        );
      if (
        save(
          (n) => {
            const doc = {
              id: existing?.id || (invoice ? "draft-" : "claim-") + Date.now(),
              reference: ref,
              company: "north",
              jobIds: ids,
              hours: ids.reduce((a, id) => a + job(id).acceptedHours, 0),
              loads: ids.reduce((a, id) => a + job(id).loads, 0),
              status: invoice ? "Unpriced draft" : "Submitted",
            };
            if (existing) n.bills[n.bills.findIndex((d) => d.id === id)] = doc;
            else (invoice ? n.invoices : n.bills).push(doc);
          },
          invoice
            ? "Unpriced invoice checklist created. Nothing sent."
            : "Quantity claim sent for NPI review in the sample.",
        )
      ) {
        close(true);
        render();
      }
    }
    if (f.id === "bill-review-form") {
      const accept = e.submitter.value === "accept";
      if (
        !accept &&
        !validate(
          value("bill-note")
            ? {}
            : { "bill-note": "Explain the revision needed." },
        )
      )
        return;
      if (
        save(
          (n) => {
            const d = n.bills.find((d) => d.id === id);
            d.status = accept ? "Accepted" : "Returned";
            d.note = value("bill-note");
          },
          accept
            ? "Quantities accepted. No price or payment approval occurred."
            : "Quantity claim returned for revision.",
        )
      ) {
        close(true);
        render();
      }
    }
  } catch (err) {
    fail(err.message || "Check the entered values and retry.");
  }
}
function clicks(e) {
  const button = e.target.closest("[data-action]");
  if (button && !button.disabled) {
    e.preventDefault();
    actions[button.dataset.action]?.(button);
  }
  const a = e.target.closest('a[href^="#"]');
  if (a && a.hash !== "#main") {
    e.preventDefault();
    go(a.hash.slice(1));
  }
}
document.addEventListener("paste", (e) => {
  if (!dlg.open || !document.querySelector("#image-paste-zone")) return;
  const file = [...(e.clipboardData?.files || [])].find((f) =>
    f.type.startsWith("image/"),
  );
  if (file) {
    e.preventDefault();
    receivePastedImage(file);
  } else if (e.target.id === "image-paste-zone") {
    e.preventDefault();
    fail(
      "No image found. Use Copy image, then paste here, or choose the image file.",
    );
  }
});
dlg.addEventListener("dragover", (e) => {
  if (e.target.closest("#image-paste-zone")) e.preventDefault();
});
dlg.addEventListener("drop", (e) => {
  if (e.target.closest("#image-paste-zone")) {
    e.preventDefault();
    receivePastedImage([...e.dataTransfer.files][0]);
  }
});
app.addEventListener("click", clicks);
app.addEventListener("submit", (e) => {
  if (e.target.id === "workbook-form") {
    e.preventDefault();
    workbookInput = $("#workbook-csv").value;
    reviewWorkbookInput();
    return;
  }
  if (e.target.id === "preview-login") {
    e.preventDefault();
    $("#login-password").value = "";
    $("#login-error").textContent =
      "Login is a visual preview. Choose a demo role below; do not enter a real password.";
  }
});
dlg.addEventListener("click", clicks);
dlg.addEventListener("submit", submit);
dlg.addEventListener("input", (e) => {
  if (e.target.closest("form")) dirty = true;
});
dlg.addEventListener("cancel", (e) => {
  e.preventDefault();
  close();
});
dlg.addEventListener("change", (e) => {
  if (e.target.id === "paste-image-file") {
    receivePastedImage(e.target.files[0]);
    return;
  }
  if (e.target.id === "mode")
    $("#crew-list").hidden = e.target.value !== "crew";
});
app.addEventListener("input", (e) => {
  if (e.target.id === "workbook-csv") {
    workbookInput = e.target.value;
    workbookDirty = true;
    $("#workbook-error").textContent = "";
    e.target.removeAttribute("aria-invalid");
    return;
  }
  if (e.isComposing) return;
  if (e.target.id === "search") {
    query = e.target.value;
    const pos = e.target.selectionStart;
    render();
    $("#search").focus();
    $("#search").setSelectionRange(pos, pos);
  }
});
app.addEventListener("change", (e) => {
  if (["schedule-date", "report-from", "report-until"].includes(e.target.id)) {
    if (e.target.id === "schedule-date") scheduleDate = e.target.value;
    if (e.target.id === "report-from") reportFrom = e.target.value;
    if (e.target.id === "report-until") reportUntil = e.target.value;
    render();
    return;
  }
  if (e.target.id === "workbook-file") {
    const file = e.target.files[0];
    if (!file) return;
    if (file.size > 100000) {
      notice("Choose a workbook CSV up to 100 KB.");
      return;
    }
    const reader = new FileReader();
    reader.onerror = () => notice("Could not read the workbook file.");
    reader.onload = () => {
      workbookInput = String(reader.result);
      render();
      $("#workbook-csv").focus();
    };
    reader.readAsText(file);
    return;
  }

  if (e.target.id === "mobile-route") {
    go(e.target.value);
    return;
  }
  if (e.target.id === "preview-role") {
    setRole(e.target.value);
    return;
  }
  if (e.target.matches("[data-brand-logo]")) {
    const file = e.target.files[0];
    if (!file) return;
    pasteImageDialog("logo");
    receivePastedImage(file);
    return;
  }

  if (e.target.id === "filter-date") {
    dateFilter = e.target.value;
    render();
  }
  if (e.target.id === "filter-site") {
    siteFilter = e.target.value;
    render();
  }
  if (e.target.matches("[data-task]")) {
    const i = Number(e.target.dataset.task);
    if (
      save((n) => {
        const x = n.jobs.find((j) => j.id === selected);
        x.tasks = e.target.checked
          ? [...new Set([...x.tasks, i])]
          : x.tasks.filter((k) => k !== i);
      }, "Checklist saved locally.")
    )
      render();
  }
  if (e.target.matches("[data-photo],[data-site-photo]")) {
    const file = e.target.files[0];
    if (!file) return;
    if (e.target.dataset.sitePhoto) {
      pasteImageDialog(e.target.dataset.sitePhoto);
      receivePastedImage(file);
      return;
    }
    if (
      !["image/jpeg", "image/png", "image/webp"].includes(file.type) ||
      file.size > 600000
    ) {
      notice("Choose a JPG, PNG or WebP photo up to 600 KB.");
      return;
    }
    const siteId = e.target.dataset.sitePhoto,
      jobId = e.target.dataset.photo;
    const reader = new FileReader();
    reader.onerror = () =>
      notice("Could not read that image. Please try another file.");
    reader.onload = () => {
      if (
        save((n) => {
          if (siteId)
            n.sites.find((s) => s.id === siteId).photo = reader.result;
          else {
            const j = n.jobs.find((j) => j.id === jobId);
            if (j.photos.length >= 3) throw Error("Photo limit");
            j.photos.push({
              name: file.name,
              data: reader.result,
              example: false,
            });
          }
        }, "Photo saved locally on this device.")
      )
        render();
    };
    reader.readAsDataURL(file);
  }
});
window.addEventListener("beforeunload", (e) => {
  if (dirty || workbookDirty) {
    e.preventDefault();
    e.returnValue = "";
  }
});
window.addEventListener("storage", (e) => {
  if (e.key === KEY) {
    conflict = true;
    if (!dlg.open) render();
    notice("Another tab changed the sample. Reload before saving.");
  }
});
window.addEventListener("hashchange", () => {
  const next = location.hash.slice(1);
  if (menu().some((x) => x[0] === next)) go(next);
});
window.addEventListener("offline", () => {
  if (!dlg.open) render();
});
window.addEventListener("online", () => {
  if (!dlg.open) render();
});
setInterval(() => {
  const timer = $("#live-timer");
  if (timer) {
    const s = job(selected).sessions.find((s) => !s.out);
    if (s) timer.textContent = elapsed(s.in.time);
  }
}, 1000);
const route = location.hash.slice(1);
if (menu().some((x) => x[0] === route)) page = route;
loadArtwork()
  .then(() => render())
  .catch((error) => {
    render();
    notice(
      error.message || "Could not load saved artwork. Choose the image again.",
    );
  });
if (
  "serviceWorker" in navigator &&
  ["http:", "https:"].includes(location.protocol) &&
  location.pathname.startsWith("/three-view/")
)
  navigator.serviceWorker
    .register("./sw.js", { scope: "./" })
    .catch(() =>
      notice(
        "Offline installation is unavailable here. The clickable sample still works.",
      ),
    );
</script>
  </body>
</html>
