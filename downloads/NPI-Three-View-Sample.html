<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#102c50" />
    <meta
      name="description"
      content="NPI three-view clickable sample with fictional work records and no contract prices."
    />
    <title>NPI Alaska · Three-view sample</title>



    <style>:root {
  --navy: #102c50;
  --ink: #182b40;
  --muted: #52657a;
  --blue: #185adb;
  --gold: #cfab55;
  --silver: #cbd5e1;
  --paper: #f3f6fa;
  --line: #d9e2ec;
  --white: #fff;
  --green: #246248;
  --red: #a42e35;
  --radius: 16px;
  font-family: "Segoe UI", Arial, sans-serif;
  color: var(--ink);
  background: var(--paper);
  font-synthesis: none;
  scrollbar-color: #8495a9 var(--paper);
  scrollbar-width: auto;
  scrollbar-gutter: stable;
}
* {
  box-sizing: border-box;
}
body {
  margin: 0;
}
button,
input,
select,
textarea {
  font: inherit;
}
button,
a,
input,
select {
  touch-action: manipulation;
}
button,
a {
  -webkit-tap-highlight-color: transparent;
}
button {
  cursor: pointer;
}
button:hover:not(:disabled) {
  filter: brightness(0.95);
}
button:active:not(:disabled) {
  transform: translateY(1px);
}
button:disabled {
  cursor: not-allowed;
  opacity: 0.55;
}
:focus-visible {
  outline: 3px solid var(--blue);
  outline-offset: 4px;
}
a {
  color: var(--blue);
}
h1,
h2,
h3,
p {
  margin: 0;
}
h1,
h2 {
  font-family: "Arial Narrow", "Segoe UI", sans-serif;
  letter-spacing: -0.035em;
}
h1 {
  font-size: 36px;
  line-height: 1.15;
}
h2 {
  font-size: 23px;
}
h3 {
  font-size: 17px;
}
p {
  line-height: 1.6;
}
small,
.small {
  font-size: 12px;
  line-height: 1.5;
}
.muted {
  color: var(--muted);
}
.bold {
  font-weight: 700;
}
svg {
  width: 20px;
  height: 20px;
  vertical-align: middle;
  flex-shrink: 0;
}
.row {
  display: flex;
  align-items: center;
  gap: 12px;
}
.between {
  justify-content: space-between;
}
.wrap {
  flex-wrap: wrap;
}
.grow {
  flex: 1;
  min-width: 0;
}
.stack {
  display: grid;
  gap: 22px;
}
.mt {
  margin-top: 24px;
}
.mt12 {
  margin-top: 12px;
}
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 44px;
  padding: 10px 16px;
  border: 1px solid var(--line);
  border-radius: 9px;
  background: white;
  color: var(--ink);
  font-weight: 650;
  font-size: 13px;
  text-decoration: none;
  line-height: 1.4;
  text-align: center;
}
.btn.primary {
  background: var(--blue);
  border-color: var(--blue);
  color: white;
}
.btn.navy {
  background: var(--navy);
  color: white;
  border-color: var(--navy);
}
.btn.success {
  background: var(--green);
  color: white;
  border-color: var(--green);
}
.btn.danger {
  color: var(--red);
  border-color: #d5abb1;
}
.btn.ghost {
  background: transparent;
  border-color: transparent;
}
.btn.wide {
  width: 100%;
  min-height: 54px;
  font-size: 15px;
}
.badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 5px 9px;
  border-radius: 6px;
  background: #e9eff7;
  color: var(--navy);
  font-size: 11px;
  font-weight: 700;
  line-height: 1.5;
}
.badge.green {
  background: #e5f2eb;
  color: var(--green);
}
.badge.orange {
  background: #fff1d7;
  color: #78510f;
}
.badge.red {
  background: #fae7e9;
  color: var(--red);
}
.badge.blue {
  background: #eaf0ff;
  color: #164bb2;
}
.dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: currentColor;
}
.panel {
  background: white;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 24px;
  min-width: 0;
}
.panel-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  margin-bottom: 22px;
}
.notice {
  padding: 14px 17px;
  border-radius: 10px;
  background: #eaf0f8;
  border: 1px solid #d4e0f0;
  color: var(--navy);
  font-size: 12px;
  line-height: 1.6;
}
.notice.warning {
  background: #fff6e4;
  border-color: #ecd59f;
  color: #715014;
}
.notice.error {
  background: #fbeaed;
  border-color: #deb9c0;
  color: var(--red);
}
.eyebrow {
  font-size: 10px;
  font-weight: 750;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--muted);
}
.top {
  background: var(--navy);
  color: white;
}
.top-inner {
  max-width: 1400px;
  margin: auto;
  min-height: 82px;
  padding: 18px 30px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
}
.brand {
  display: flex;
  align-items: center;
  gap: 12px;
}
.mark {
  width: 41px;
  height: 41px;
  border: 1px solid #d7bf7e;
  border-radius: 50%;
  color: #e2ca90;
  display: grid;
  place-items: center;
  font-weight: 800;
  letter-spacing: -1px;
}
.brand b {
  font-size: 20px;
  letter-spacing: 0.025em;
}
.brand small {
  display: block;
  color: #bdcee2;
  font-size: 9px;
  letter-spacing: 0.21em;
  margin-top: 3px;
}
.top .status {
  color: #cfdaea;
  font-size: 12px;
}
.rolebar {
  background: white;
  border-bottom: 1px solid var(--line);
}
.role-inner {
  max-width: 1400px;
  margin: auto;
  padding: 14px 30px;
  display: flex;
  align-items: center;
  gap: 16px;
}
.rolechoices {
  display: flex;
  gap: 8px;
  flex: 1;
}
.role {
  min-height: 54px;
  display: flex;
  align-items: center;
  gap: 10px;
  text-align: left;
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 9px;
  padding: 10px 16px;
  color: var(--muted);
  font-size: 13px;
  font-weight: 650;
}
.role[aria-pressed="true"] {
  border-color: var(--navy);
  background: var(--navy);
  color: white;
  box-shadow: inset 0 -3px var(--gold);
}
.role small {
  display: block;
  color: inherit;
  font-size: 10px;
  opacity: 1;
}
.avatar {
  display: grid;
  place-items: center;
  width: 34px;
  height: 34px;
  border-radius: 50%;
  background: #e7eef7;
  font-size: 11px;
  color: var(--navy);
  font-weight: 750;
  flex-shrink: 0;
}
.samplebar {
  max-width: 1340px;
  margin: 18px auto 0;
  padding: 10px 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 15px;
  background: #fff5e2;
  border: 1px solid #ebd2a0;
  border-radius: 9px;
  color: #74501a;
  font-size: 11px;
  line-height: 1.5;
}
.samplebar .btn {
  min-height: 30px;
  padding: 4px 8px;
  font-size: 11px;
  color: #74501a;
}
.navwrap {
  max-width: 1400px;
  margin: auto;
  padding: 20px 30px 0;
}
.tabs {
  display: flex;
  gap: 8px;
  border-bottom: 1px solid var(--line);
  padding-bottom: 12px;
  overflow: auto;
}
.tabs a {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 15px;
  border-radius: 8px;
  color: var(--muted);
  font-size: 13px;
  font-weight: 650;
  text-decoration: none;
  white-space: nowrap;
  min-height: 42px;
}
.tabs a[aria-current="page"] {
  color: var(--blue);
  background: #e7eefc;
}
.tabs a:hover {
  background: #e7edf6;
}
.counter {
  font-size: 10px;
  background: #e8d8af;
  padding: 1px 5px;
  border-radius: 4px;
  color: #634510;
}
.main {
  max-width: 1400px;
  margin: auto;
  padding: 28px 30px 50px;
}
.pagehead {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 20px;
  margin-bottom: 26px;
}
.pagehead .eyebrow {
  margin-bottom: 8px;
}
.pagehead p {
  font-size: 14px;
  color: var(--muted);
  margin-top: 8px;
  max-width: 750px;
}
.datebox {
  font-size: 12px;
  color: var(--muted);
  text-align: right;
  line-height: 1.7;
}
.metrics {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 16px;
  margin: 22px 0;
}
.metric {
  background: white;
  border: 1px solid var(--line);
  padding: 20px 22px;
  border-radius: 12px;
  min-width: 0;
}
.metric .row {
  justify-content: space-between;
}
.metric svg {
  color: var(--blue);
  width: 19px;
  height: 19px;
}
.metric label {
  font-size: 12px;
  color: var(--muted);
}
.metric strong {
  display: block;
  font-size: 33px;
  letter-spacing: -0.035em;
  margin: 8px 0 4px;
  line-height: 1.15;
}
.metric small {
  font-size: 10px;
  color: var(--muted);
}
.two {
  display: grid;
  grid-template-columns: minmax(0, 1.65fr) minmax(280px, 1fr);
  gap: 22px;
}
.three {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 18px;
}
.dispatch {
  display: flex;
  align-items: center;
  gap: 20px;
  border: 1px solid #b9cce7;
  border-radius: 12px;
  padding: 20px 24px;
  background: #eaf0f8;
}
.dispatch .round {
  width: 42px;
  height: 42px;
  display: grid;
  place-items: center;
  background: white;
  border-radius: 12px;
  color: var(--blue);
}
.dispatch h3 {
  font-size: 15px;
}
.dispatch p {
  font-size: 12px;
  color: var(--muted);
  margin-top: 4px;
}
.table-scroll {
  overflow: auto;
  scrollbar-gutter: stable;
}
table {
  width: 100%;
  border-collapse: collapse;
  text-align: left;
  font-size: 12px;
}
caption {
  font-size: 11px;
  color: var(--muted);
  text-align: left;
  line-height: 1.6;
  padding-bottom: 14px;
}
th {
  font-size: 9px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  background: #f4f7fb;
  color: var(--muted);
  padding: 12px 10px;
  font-weight: 700;
}
td {
  border-bottom: 1px solid var(--line);
  padding: 16px 10px;
  vertical-align: middle;
}
tr:last-child td {
  border-bottom: 0;
}
.table-scroll .btn {
  min-height: 34px;
  padding: 6px 10px;
  font-size: 11px;
  white-space: nowrap;
}
td b {
  font-size: 12px;
}
.table-scroll small {
  font-size: 10px;
}
.taskline {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 15px 0;
  border-bottom: 1px solid var(--line);
  font-size: 14px;
  line-height: 1.5;
  min-height: 56px;
}
.taskline input {
  width: 22px;
  height: 22px;
  accent-color: var(--blue);
  flex-shrink: 0;
}
.taskline:has(input:checked) {
  color: var(--green);
}
.jobcard {
  border: 1px solid var(--line);
  background: white;
  border-radius: var(--radius);
  overflow: hidden;
  min-width: 0;
}
.card-art {
  height: 110px;
  background: #dce8ee;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 20px 24px;
  color: #6a8799;
  background-image: linear-gradient(
    145deg,
    transparent 40%,
    #c6d9e2 40%,
    #c6d9e2 65%,
    transparent 65%
  );
}
.card-art.port {
  background-color: #dce9e6;
  background-image: linear-gradient(
    145deg,
    transparent 40%,
    #bed4d0 40%,
    #bed4d0 65%,
    transparent 65%
  );
}
.card-art svg {
  width: 54px;
  height: 54px;
  stroke-width: 1.3;
}
.card-art .eyebrow {
  padding: 7px 9px;
  background: #ffffffde;
  border-radius: 5px;
  color: var(--navy);
  font-size: 9px;
}
.card-body {
  padding: 22px;
}
.card-body h2 {
  font-size: 22px;
  margin: 12px 0 6px;
}
.card-body p {
  font-size: 12px;
  color: var(--muted);
}
.card-detail {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  padding: 17px 0;
  margin: 17px 0;
  border-block: 1px solid var(--line);
  font-size: 12px;
}
.card-detail small {
  display: block;
  color: var(--muted);
  font-size: 9px;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  margin-bottom: 7px;
}
.line {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 16px;
  padding: 13px 0;
  border-bottom: 1px solid var(--line);
  font-size: 12px;
  line-height: 1.6;
}
.line span {
  color: var(--muted);
}
.line b {
  text-align: right;
  max-width: 68%;
}
.flow {
  list-style: none;
  padding: 0;
  margin: 0;
  display: grid;
  gap: 18px;
}
.flow li {
  display: flex;
  gap: 12px;
  align-items: flex-start;
}
.step {
  width: 27px;
  height: 27px;
  border: 1px solid #c8d6e7;
  border-radius: 50%;
  display: grid;
  place-items: center;
  color: var(--blue);
  font-size: 11px;
  font-weight: 750;
  flex-shrink: 0;
}
.flow b {
  font-size: 13px;
}
.flow p {
  font-size: 11px;
  color: var(--muted);
  margin-top: 4px;
}
.toolbar {
  display: flex;
  gap: 12px;
  align-items: center;
  justify-content: space-between;
  margin: 18px 0;
  flex-wrap: wrap;
}
.chips {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}
.chip {
  border: 1px solid var(--line);
  border-radius: 7px;
  padding: 9px 13px;
  background: white;
  color: var(--muted);
  font-size: 12px;
  min-height: 39px;
}
.chip[aria-pressed="true"] {
  background: var(--navy);
  color: white;
  border-color: var(--navy);
}
.search {
  position: relative;
  max-width: 300px;
  min-width: 200px;
}
.search input {
  height: 42px;
  border: 1px solid #bfcede;
  border-radius: 8px;
  padding: 10px 42px 10px 13px;
  width: 100%;
  background: white;
}
.search button {
  position: absolute;
  right: 4px;
  top: 4px;
  min-height: 34px;
  min-width: 34px;
  padding: 4px;
}
.field {
  display: grid;
  gap: 7px;
  margin-bottom: 18px;
  min-width: 0;
}
.field label {
  font-size: 12px;
  font-weight: 650;
}
.field input,
.field select,
.field textarea {
  width: 100%;
  border: 1px solid #b7c8dc;
  border-radius: 8px;
  padding: 11px 12px;
  min-height: 46px;
  background: white;
  color: var(--ink);
}
.field textarea {
  resize: none;
  min-height: 110px;
  line-height: 1.5;
}
.field small {
  font-size: 10px;
  color: var(--muted);
}
[aria-invalid="true"] {
  border-color: var(--red) !important;
}
.err {
  font-size: 11px;
  color: var(--red);
  line-height: 1.5;
  min-height: 16px;
}
.error:not(:empty) {
  padding: 13px;
  background: #fbeaed;
  color: var(--red);
  border: 1px solid #dfbbc0;
  border-radius: 8px;
  line-height: 1.6;
}
.empty {
  padding: 35px 20px;
  text-align: center;
}
.empty p {
  font-size: 13px;
  color: var(--muted);
  max-width: 430px;
  margin: 12px auto 20px;
}
.progress {
  height: 6px;
  border-radius: 4px;
  overflow: hidden;
  background: #e4edf5;
  margin: 14px 0;
}
.progress span {
  display: block;
  height: 100%;
  background: var(--blue);
}
.evidence {
  display: flex;
  align-items: center;
  gap: 14px;
  border: 1px dashed #b9cde3;
  padding: 16px;
  border-radius: 10px;
  background: #f7f9fc;
}
.evidence svg {
  color: var(--blue);
}
.evidence p {
  font-size: 11px;
  color: var(--muted);
}
.evidence .btn {
  font-size: 11px;
  min-height: 38px;
}
.sitephoto {
  height: 150px;
  background: #e4edf3;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  color: #57758c;
}
.sitephoto img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.sitephoto:has(img) {
  padding: 0;
}
.sitephoto svg {
  width: 52px;
  height: 52px;
}
.photo-input {
  display: grid;
  gap: 8px;
  font-size: 11px;
  line-height: 1.6;
  margin-top: 16px;
}
.photo-input input {
  max-width: 100%;
  font-size: 11px;
}
dialog {
  border: 1px solid var(--line);
  border-radius: 16px;
  box-shadow: 0 24px 90px #102c5040;
  width: min(760px, calc(100vw - 28px));
  max-height: calc(100dvh - 40px);
  overflow: auto;
  padding: 0;
  color: var(--ink);
}
dialog::backdrop {
  background: #0d234a9c;
}
.dialog-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 22px 24px;
  border-bottom: 1px solid var(--line);
}
.dialog-head h2 {
  font-size: 22px;
}
.dialog-head .btn {
  width: 38px;
  min-height: 38px;
  padding: 5px;
}
.dialog-body {
  padding: 24px;
}
.actions {
  display: flex;
  justify-content: flex-end;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  margin-top: 24px;
}
fieldset {
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 14px;
}
legend {
  font-size: 12px;
  font-weight: 650;
}
#notice {
  position: fixed;
  bottom: 24px;
  right: 24px;
  max-width: calc(100vw - 36px);
  background: var(--navy);
  color: white;
  border-radius: 10px;
  padding: 15px 20px;
  font-size: 12px;
  line-height: 1.6;
  box-shadow: 0 5px 25px #102c5030;
  z-index: 50;
}
#notice:empty {
  display: none;
}
.footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 18px;
  flex-wrap: wrap;
  color: var(--muted);
  font-size: 10px;
  margin-top: 30px;
  line-height: 1.6;
}
.skip {
  position: absolute;
  top: -60px;
  left: 10px;
  background: white;
  padding: 10px;
  z-index: 100;
}
.skip:focus {
  top: 10px;
}
.log {
  list-style: none;
  margin: 0;
  padding: 0;
}
.log li {
  padding: 12px 0;
  border-bottom: 1px solid var(--line);
  font-size: 12px;
  line-height: 1.6;
}
.log small {
  display: block;
  color: var(--muted);
  margin-top: 5px;
}
.pill-note {
  font-size: 11px;
  color: var(--muted);
  line-height: 1.6;
}
.site-summary {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 14px;
}
.mini-site {
  padding: 16px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: #fafcfe;
}
.mini-site h3 {
  font-size: 13px;
  margin-bottom: 10px;
}
.mini-site b {
  font-size: 24px;
  letter-spacing: -0.025em;
}
.mini-site small {
  font-size: 10px;
  color: var(--muted);
}
.filter-fields {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 12px;
}
.filter-fields .field {
  margin: 0;
}
::-webkit-scrollbar {
  width: 12px;
  height: 12px;
}
::-webkit-scrollbar-track {
  background: var(--paper);
}
::-webkit-scrollbar-thumb {
  background: #8495a9;
  border: 3px solid var(--paper);
  border-radius: 10px;
}
::-webkit-scrollbar-thumb:hover {
  background: var(--muted);
}
@media (max-width: 1050px) {
  .two {
    grid-template-columns: 1fr;
  }
  .three {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
  .role-inner .identity {
    display: none;
  }
  .role {
    flex: 1;
  }
  .metrics {
    gap: 10px;
  }
  .metric {
    padding: 18px;
  }
  .samplebar {
    margin-inline: 30px;
  }
  .status {
    display: none;
  }
}
@media (max-width: 700px) {
  :root {
    scrollbar-gutter: auto;
  }
  .top-inner {
    min-height: 68px;
    padding: 14px 18px;
  }
  .brand b {
    font-size: 18px;
  }
  .brand small {
    font-size: 8px;
  }
  .top .badge {
    font-size: 9px;
  }
  .role-inner {
    padding: 12px 14px;
  }
  .rolechoices {
    gap: 6px;
  }
  .role {
    padding: 10px 7px;
    justify-content: center;
    text-align: center;
    min-height: 61px;
    font-size: 11px;
  }
  .role svg,
  .role small {
    display: none;
  }
  .role .role-label {
    max-width: 100px;
    line-height: 1.5;
  }
  .samplebar {
    margin: 12px 14px 0;
    padding: 9px 11px;
    font-size: 10px;
    gap: 8px;
  }
  .samplebar .btn {
    font-size: 10px;
    min-width: 45px;
  }
  .navwrap {
    padding: 12px 14px 0;
  }
  .tabs {
    gap: 4px;
    padding-bottom: 10px;
  }
  .tabs a {
    font-size: 11px;
    padding: 9px 10px;
    min-height: 41px;
  }
  .tabs svg {
    width: 17px;
    height: 17px;
  }
  .main {
    padding: 22px 16px 35px;
  }
  .pagehead {
    align-items: flex-start;
    flex-wrap: wrap;
    gap: 14px;
    margin-bottom: 23px;
  }
  .pagehead h1 {
    font-size: 29px;
  }
  .pagehead p {
    font-size: 12px;
  }
  .pagehead .eyebrow {
    font-size: 9px;
  }
  .datebox {
    display: none;
  }
  .metrics {
    grid-template-columns: 1fr 1fr;
    margin: 18px 0;
    gap: 10px;
  }
  .metric {
    padding: 15px;
  }
  .metric label {
    font-size: 10px;
  }
  .metric strong {
    font-size: 28px;
  }
  .metric small {
    font-size: 9px;
  }
  .metric svg {
    width: 16px;
    height: 16px;
  }
  .panel {
    padding: 19px;
  }
  .panel-head {
    flex-wrap: wrap;
  }
  .panel h2 {
    font-size: 21px;
  }
  .dispatch {
    padding: 15px;
    gap: 12px;
    align-items: flex-start;
  }
  .dispatch .round {
    width: 34px;
    height: 34px;
    flex-shrink: 0;
  }
  .dispatch h3 {
    font-size: 14px;
  }
  .dispatch p {
    font-size: 11px;
  }
  .three {
    grid-template-columns: 1fr;
  }
  .card-art {
    height: 95px;
  }
  .card-body {
    padding: 20px;
  }
  .card-body h2 {
    font-size: 23px;
  }
  .card-body p {
    font-size: 13px;
  }
  .card-detail {
    font-size: 12px;
  }
  .card-detail small {
    font-size: 9px;
  }
  .taskline {
    font-size: 15px;
    min-height: 63px;
  }
  .taskline input {
    width: 24px;
    height: 24px;
  }
  .evidence {
    align-items: flex-start;
    flex-wrap: wrap;
  }
  .evidence .btn {
    width: 100%;
    min-height: 46px;
  }
  .btn {
    min-height: 46px;
  }
  .btn.wide {
    min-height: 54px;
  }
  .toolbar {
    gap: 12px;
  }
  .search {
    max-width: none;
    width: 100%;
  }
  .chip {
    font-size: 11px;
    padding: 9px 10px;
  }
  .table-scroll {
    margin-inline: -3px;
  }
  th {
    padding: 11px 8px;
    font-size: 9px;
  }
  td {
    padding: 14px 8px;
    font-size: 11px;
  }
  .table-scroll .btn {
    min-height: 38px;
  }
  .table-scroll .badge {
    font-size: 9px;
  }
  .dialog-head {
    padding: 18px;
  }
  .dialog-body {
    padding: 20px;
  }
  .actions .btn {
    flex: 1;
  }
  .line {
    flex-wrap: wrap;
  }
  .line b {
    max-width: 100%;
    text-align: left;
  }
  .filter-fields {
    grid-template-columns: 1fr;
  }
  .site-summary {
    grid-template-columns: 1fr 1fr;
  }
  .mini-site {
    padding: 12px;
  }
  .mini-site h3 {
    font-size: 12px;
  }
  .mini-site b {
    font-size: 22px;
  }
  .footer {
    font-size: 9px;
  }
  .empty {
    padding: 28px 10px;
  }
}
@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation: none !important;
    transition: none !important;
    scroll-behavior: auto !important;
  }
}
@media (forced-colors: active) {
  :root {
    scrollbar-color: auto;
  }
  .badge,
  .btn,
  .role {
    border: 1px solid ButtonText;
  }
}
@media print {
  .top,
  .rolebar,
  .samplebar,
  .navwrap,
  .btn,
  #notice {
    display: none !important;
  }
  .main {
    padding: 0;
  }
  .panel,
  .metric {
    break-inside: avoid;
  }
}

h1 {
  font-family: NPIHeading, "Arial Narrow", sans-serif;
}
.reference-sidebar {
  position: fixed;
  inset: 0 auto 0 0;
  width: 266px;
  overflow-y: auto;
  background: #081829;
  color: #b2c1d3;
  padding: 30px 12px 24px;
  scrollbar-color: #9aadc0 #e2e9f0;
}
.side-brand {
  text-align: center;
}
.brand-image.sidebar,
.brand-placeholder.sidebar {
  width: 135px;
  height: 135px;
  margin: auto;
  object-fit: contain;
}
.brand-placeholder {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  border: 1px solid #657b94;
  background: #102b48;
  color: #d9e3ef;
}
.brand-placeholder span {
  font-size: 40px;
  font-weight: 800;
}
.brand-placeholder small {
  font-size: 9px;
  letter-spacing: 1px;
}
.side-brand h2 {
  font-family: "Segoe UI", sans-serif;
  letter-spacing: 0.02em;
  color: white;
  font-size: 24px;
  margin-top: 20px;
}
.side-brand p {
  font-size: 10px;
  letter-spacing: 1.4px;
  margin-top: 4px;
}
.side-label {
  font-size: 10px;
  letter-spacing: 1.5px;
  margin: 28px 14px 14px;
}
.side-nav {
  display: grid;
  gap: 6px;
}
.side-nav a {
  display: flex;
  gap: 12px;
  align-items: center;
  min-height: 54px;
  color: #b2c1d3;
  text-decoration: none;
  padding: 12px 16px;
  font-size: 14px;
  font-weight: 600;
  border-left: 4px solid transparent;
  border-radius: 10px;
}
.side-nav a:hover {
  background: #142c46;
}
.side-nav a[aria-current] {
  background: #27486d;
  border-left-color: #e5b94e;
  color: white;
}
.side-nav svg {
  flex-shrink: 0;
}
.side-count {
  margin-left: auto;
  background: #eff4fa;
  color: #263b53;
  border-radius: 4px;
  padding: 6px 9px;
}
.side-bottom {
  display: flex;
  align-items: center;
  gap: 10px;
  border-top: 1px solid #26384c;
  margin: 26px 8px 0;
  padding-top: 20px;
  font-size: 12px;
}
.side-bottom p {
  font-size: 11px;
}
.side-bottom .btn {
  color: white;
  padding: 8px;
}
.reference-workspace {
  margin-left: 266px;
}
.reference-topbar {
  height: 94px;
  background: white;
  border-bottom: 1px solid var(--line);
  padding: 20px 56px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
}
.top-crumb b {
  font-size: 12px;
  letter-spacing: 1.7px;
  color: var(--muted);
}
.top-crumb p {
  font-size: 13px;
  color: var(--muted);
  margin-top: 4px;
}
.top-controls {
  display: flex;
  align-items: center;
  gap: 18px;
}
.top-controls label {
  font-size: 12px;
  font-weight: 600;
  color: var(--muted);
}
.top-controls select {
  width: 252px;
  height: 44px;
  background: white;
  border: 1px solid #b8c9dc;
  border-radius: 8px;
  padding: 0 14px;
  font-size: 13px;
  color: var(--ink);
}
.bell-button {
  position: relative;
  border: 0;
  background: transparent;
  padding: 12px;
}
.bell-count {
  position: absolute;
  right: 0;
  top: -4px;
  font-size: 10px;
  border-radius: 50%;
  background: #e7bf5c;
  color: #081829;
  padding: 3px 6px;
}
.top-avatar {
  border-radius: 50%;
  width: 44px;
  height: 44px;
  background: #e6edf6;
  display: grid;
  place-items: center;
  font-size: 14px;
  font-weight: 700;
}
.reference-workspace .main {
  max-width: none;
  margin: 0;
  padding: 42px 56px;
}
.reference-demo {
  min-height: 55px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  background: #e9eff6;
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 10px 16px;
  color: #526980;
  font-size: 12px;
}
.reference-demo .btn {
  font-size: 11px;
  min-height: 32px;
  padding: 6px 10px;
  border-radius: 10px;
  white-space: nowrap;
}
.reference-content {
  margin-top: 32px;
}
.pagehead {
  margin-bottom: 30px;
}
.pagehead .datebox {
  display: none;
}
.pagehead h1 {
  font-size: 36px;
  margin: 10px 0;
}
.pagehead .eyebrow {
  font-size: 12px;
  letter-spacing: 1.8px;
}
.pagehead p:not(.eyebrow) {
  font-size: 15px;
  color: #5c718b;
}
.oversight-hero {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 30px;
  background: #112d52;
  border-bottom: 3px solid #e7bc51;
  border-radius: 16px;
  min-height: 177px;
  padding: 32px;
  color: #fff;
  margin-bottom: 26px;
}
.oversight-hero .eyebrow {
  color: #b0c6e0;
  letter-spacing: 2px;
  font-size: 13px;

  const seconds = Math.max(
    0,
    Math.floor((Date.now() - Date.parse(time)) / 1000),

}

  },
  export: () => {
    const rows = [
      [
        "Work ID",
        "Location",
        "Company",
        "Recorded worker-hours",
        "Claimed worker-hours",
        "NPI-accepted worker-hours",
        "Status",
      ],
      ...visible().map((j) => [
        j.id,
        site(j.site).name,
        company(j.company).name,
        recordedHours(j),
        j.claimedHours ?? "",
        j.acceptedHours ?? "",
        labels[j.status],
      ]),
    ];
    const cell = (v) =>
      '"' +
      String(v)
        .replace(/^[=+@-]/, "'" + "$&")
        .replaceAll('"', '""') +
      '"';
    const blob = new Blob(
        ["\ufeff" + rows.map((r) => r.map(cell).join(",")).join("\r\n")],
        { type: "text/csv;charset=utf-8" },
      ),
      url = URL.createObjectURL(blob),
      a = document.createElement("a");
    a.href = url;
    a.download = "NPI-Three-View-Hours-Sample.csv";
    a.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    notice("Sample hours exported. No prices or contract content included.");
  },
  reset: () =>
    modal(
      "Reset this sample?",
      `<p>This removes only the three-view sample’s local changes and selected photos.</p><div class="actions">${btn("Keep sample", "close", "", "primary")}${btn("Reset sample", "reset-confirm", "", "danger")}</div>`,
    ),
  "reset-confirm": () => {
    try {
      localStorage.removeItem(KEY);
      state = seed();
      conflict = false;
      close(true);
      render();
      notice("Three-view sample reset.");
    } catch {
      fail("Could not reset browser storage.");
    }
  },
};
function submit(e) {
  e.preventDefault();
  const f = e.target,
    id = f.dataset.id,
    j = job(id),
    value = (k) => $("#" + k, f)?.value.trim() || "";
  try {
    if (f.id === "assign-worker-form") {
      const p = person(value("assign-person"));
      if (
        role !== "sub" ||
        j.company !== "north" ||
        j.status !== "draft" ||
        j.sessions.length ||
        !p?.active ||
        p.company !== j.company
      )
        throw Error(
          "Only an active worker in your company can be assigned before attendance begins.",
        );
      if (
        save((n) => {
          n.jobs.find((x) => x.id === id).worker = p.id;
          n.audit.unshift({
            text: `${id}: company assigned ${p.name}.`,
            company: j.company,
            actor: roles[role].name,
            at: new Date().toISOString(),
          });
        }, "Company assignment saved locally.")
      ) {
        close(true);
        render();
      }
    }
    if (f.id === "request-form") {
      if (
        !validate(
          value("request-description")
            ? {}
            : { "request-description": "Describe the additional work." },
        )
      )
        return;
      if (
        save((n) => {
          (n.requests ||= []).push({
            id: "REQUEST-" + Date.now(),
            site: value("request-site"),
            description: value("request-description"),
            company: "north",
          });
        }, "Sample request saved locally.")
      ) {
        close(true);
        render();
      }
    }
    if (f.id === "job-form") {
      if (role !== "npi") return;
      if (state.jobs.length >= 20)
        throw Error("The sample is limited to 20 work records.");
      const errors = {};
      if (!value("job-title")) errors["job-title"] = "Describe the work.";
      if (person(value("job-worker")).company !== value("job-company"))
        errors["job-worker"] = "Choose a worker from the selected company.";
      if (!value("job-date")) errors["job-date"] = "Choose a planned date.";
      const selectedSite = site(value("job-site"));
      if (
        (selectedSite.family === "hauling") !==
        (value("job-service") === "Hauling")
      )
        errors["job-service"] =
          "Choose hauling for the port, or a site service for a courthouse.";
      if (!validate(errors)) return;
      if (
        save((n) => {
          const id =
            "DEMO-" +
            (Math.max(...n.jobs.map((j) => Number(j.id.slice(5)))) + 1);
          n.jobs.unshift({
            id,
            site: selectedSite.id,
            family: selectedSite.family,
            service: value("job-service"),
            title: value("job-title"),
            company: value("job-company"),
            worker: value("job-worker"),
            equipment: value("job-equipment") || "To be confirmed",
            date: value("job-date"),
            status: "draft",
            sessions: [],
            tasks: [],
            photos: [],
            timecard: null,
            loads: 0,
            claimedBy: {},
            acceptedBy: {},
          });
          n.audit.unshift({
            text: `${id}: sample assignment created.`,
            company: value("job-company"),
            actor: roles[role].name,
            at: new Date().toISOString(),
          });
        }, "Sample assignment created.")
      ) {
        close(true);
        go("orders");
      }
    }
    if (f.id === "claim-form") {
      const by = {},
        errors = {};
      for (const id of roster(j)) {
        by[id] = Number(value("claim-" + id));
        if (!Number.isFinite(by[id]) || by[id] < 0 || by[id] > 10000)
          errors["claim-" + id] = "Enter valid nonnegative hours.";
      }
      const total = Object.values(by).reduce((a, b) => a + b, 0);
      if (Math.abs(total - recordedHours(j)) > 0.0001 && !value("claim-note"))
        errors["claim-note"] =
          "Explain why the claim differs from recorded attendance.";
      if (!validate(errors)) return;
      if (
        save((n) => {
          const x = n.jobs.find((j) => j.id === id);
          x.claimedBy = by;
          x.claimedHours = total;
          x.note = value("claim-note");
          x.status = "contractor-review";
          x.acceptedBy = {};
          delete x.acceptedHours;
          n.audit.unshift({
            text: `${id}: worker sent ${h(total)} claimed hours to company review.`,
            company: x.company,
            actor: roles[role].name,
            at: new Date().toISOString(),
          });
        }, "Claim sent to Subcontractor Admin.")
      ) {
        close(true);
        render();
      }
    }
    if (f.id === "verify-form") {
      if (role !== "npi") return;
      const by = {},
        errors = {};
      for (const id of roster(j)) {
        by[id] = Number(value("accept-" + id));
        if (!Number.isFinite(by[id]) || by[id] < 0 || by[id] > 10000)
          errors["accept-" + id] = "Enter valid nonnegative hours.";
      }
      if (
        Object.keys(by).some(
          (id) => Math.abs(by[id] - j.claimedBy[id]) > 0.0001,
        ) &&
        !value("verify-note")
      )
        errors["verify-note"] = "Explain the adjustment to claimed hours.";
      if (!validate(errors)) return;
      if (overlappingWorkers(j, state.jobs).length)
        throw Error(
          "Overlapping attendance must be resolved before acceptance.",
        );
      const total = Object.values(by).reduce((a, b) => a + b, 0),
        approved = approveHours(j, total, value("verify-note"));
      if (
        save((n) => {
          n.jobs[n.jobs.findIndex((j) => j.id === id)] = {
            ...approved,
            acceptedBy: by,
          };
          n.audit.unshift({
            text: `${id}: NPI accepted ${h(total)} hours. ${value("verify-note")}`,
            company: j.company,
            actor: roles[role].name,
            at: new Date().toISOString(),
          });
        }, "Verified hours accepted. Original attendance and claim retained.")
      ) {
        close(true);
        render();
      }
    }
    if (f.id === "return-form") {
      if (
        !validate(
          value("correction")
            ? {}
            : { correction: "Give the worker a clear correction reason." },
        )
      )
        return;
      if (
        save((n) => {
          const x = n.jobs.find((j) => j.id === id);
          x.status = "returned";
          x.returnReason = value("correction");
          n.audit.unshift({
            text: `${id}: correction requested: ${value("correction")}`,
            company: x.company,
            actor: roles[role].name,
            at: new Date().toISOString(),
          });
        }, "Returned to the worker. Resubmission passes through both review stages again.")
      ) {
        close(true);
        render();
      }
    }
    if (f.id === "loads-form") {
      const count = Number(value("load-count"));
      if (
        !validate(
          Number.isInteger(count) && count >= 0 && count <= 9999
            ? {}
            : { "load-count": "Enter a whole load count from 0 to 9,999." },
        )
      )
        return;
      if (
        save(
          (n) => (n.jobs.find((j) => j.id === id).loads = count),
          "Load count saved locally.",
        )
      ) {
        close(true);
        render();
      }
    }
    if (f.id === "person-form") {
      const name = value("person-name"),
        username = value("person-username"),
        errors = {};
      if (!name) errors["person-name"] = "Enter a worker name.";
      if (!/^[a-zA-Z0-9._-]{3,32}$/.test(username))
        errors["person-username"] =
          "Use 3–32 letters, numbers, dots, underscores or hyphens.";
      if (
        state.people.some(
          (p) => p.username.toLowerCase() === username.toLowerCase(),
        )
      )
        errors["person-username"] = "That sample username is already used.";
      if (!validate(errors)) return;
      if (
        save(
          (n) =>
            n.people.push({
              id: "person-" + Date.now(),
              name,
              username,
              company: "north",
              active: true,
            }),
          "Sample profile saved. No login account was created.",
        )
      ) {
        close(true);
        render();
      }
    }
    if (f.id === "site-form") {
      if (
        save(
          (n) =>
            (n.sites.find((s) => s.id === id).address = value("site-address")),
          "Site address saved only in this sample.",
        )
      ) {
        close(true);
        render();
      }
    }
    if (f.id === "document-form") {
      const invoice = f.dataset.kind === "invoice",
        docs = invoice ? state.invoices : state.bills,
        existing = docs.find((d) => d.id === id),
        ids = [...f.querySelectorAll("input[name=bill-job]:checked")].map(
          (x) => x.value,
        ),
        ref = value("doc-reference"),
        errors = {};
      if (!ref) errors["doc-reference"] = "Enter a reference.";
      if (
        docs.some(
          (d) => d.id !== id && d.reference.toLowerCase() === ref.toLowerCase(),
        )
      )
        errors["doc-reference"] = "That reference is already used.";
      if (!validate(errors)) return;
      if (!ids.length) {
        fail("Select at least one approved work record.");
        return;
      }
      const allocated = new Set(
        docs.filter((d) => d.id !== id).flatMap((d) => d.jobIds),
      );
      if (
        ids.some(
          (id) =>
            allocated.has(id) ||
            job(id).status !== "approved" ||
            !hasBothLocations(job(id)) ||
            (!invoice && job(id).company !== "north"),
        )
      )
        throw Error(
          "Only unallocated, permitted, NPI-approved work can be included.",
        );
      if (
        save(
          (n) => {
            const doc = {
              id: existing?.id || (invoice ? "draft-" : "claim-") + Date.now(),
              reference: ref,
              company: "north",
              jobIds: ids,
              hours: ids.reduce((a, id) => a + job(id).acceptedHours, 0),
              loads: ids.reduce((a, id) => a + job(id).loads, 0),
              status: invoice ? "Unpriced draft" : "Submitted",
            };
            if (existing) n.bills[n.bills.findIndex((d) => d.id === id)] = doc;
            else (invoice ? n.invoices : n.bills).push(doc);
          },
          invoice
            ? "Unpriced invoice checklist created. Nothing sent."
            : "Quantity claim sent for NPI review in the sample.",
        )
      ) {
        close(true);
        render();
      }
    }
    if (f.id === "bill-review-form") {
      const accept = e.submitter.value === "accept";
      if (
        !accept &&
        !validate(
          value("bill-note")
            ? {}
            : { "bill-note": "Explain the revision needed." },
        )
      )
        return;
      if (
        save(
          (n) => {
            const d = n.bills.find((d) => d.id === id);
            d.status = accept ? "Accepted" : "Returned";
            d.note = value("bill-note");
          },
          accept
            ? "Quantities accepted. No price or payment approval occurred."
            : "Quantity claim returned for revision.",
        )
      ) {
        close(true);
        render();
      }
    }
  } catch (err) {
    fail(err.message || "Check the entered values and retry.");
  }
}
function clicks(e) {
  const button = e.target.closest("[data-action]");
  if (button && !button.disabled) {
    e.preventDefault();
    actions[button.dataset.action]?.(button);
  }
  const a = e.target.closest('a[href^="#"]');
  if (a && a.hash !== "#main") {
    e.preventDefault();
    go(a.hash.slice(1));
  }
}
app.addEventListener("click", clicks);
app.addEventListener("submit", (e) => {
  if (e.target.id === "preview-login") {
    e.preventDefault();
    $("#login-password").value = "";
    $("#login-error").textContent =
      "Login is a visual preview. Choose a demo role below; do not enter a real password.";
  }
});
dlg.addEventListener("click", clicks);
dlg.addEventListener("submit", submit);
dlg.addEventListener("input", (e) => {
  if (e.target.closest("form")) dirty = true;
});
dlg.addEventListener("cancel", (e) => {
  e.preventDefault();
  close();
});
dlg.addEventListener("change", (e) => {
  if (e.target.id === "mode")
    $("#crew-list").hidden = e.target.value !== "crew";
});
app.addEventListener("input", (e) => {
  if (e.isComposing) return;
  if (e.target.id === "search") {
    query = e.target.value;
    const pos = e.target.selectionStart;
    render();
    $("#search").focus();
    $("#search").setSelectionRange(pos, pos);
  }
});
app.addEventListener("change", (e) => {
  if (e.target.id === "preview-role") {
    setRole(e.target.value);
    return;
  }
  if (e.target.matches("[data-brand-logo]")) {
    const file = e.target.files[0];
    if (!file) return;
    if (
      !["image/jpeg", "image/png", "image/webp"].includes(file.type) ||
      file.size > 600000
    ) {
      notice("Choose a PNG, JPG or WebP emblem up to 600 KB.");
      return;
    }
    const reader = new FileReader();
    reader.onerror = () => notice("Could not read the emblem image.");
    reader.onload = () => {
      if (
        save(
          (n) => (n.brandLogo = reader.result),
          "Original emblem saved on this device.",
        )
      )
        render();
    };
    reader.readAsDataURL(file);
    return;
  }

  if (e.target.id === "filter-date") {
    dateFilter = e.target.value;
    render();
  }
  if (e.target.id === "filter-site") {
    siteFilter = e.target.value;
    render();
  }
  if (e.target.matches("[data-task]")) {
    const i = Number(e.target.dataset.task);
    if (
      save((n) => {
        const x = n.jobs.find((j) => j.id === selected);
        x.tasks = e.target.checked
          ? [...new Set([...x.tasks, i])]
          : x.tasks.filter((k) => k !== i);
      }, "Checklist saved locally.")
    )
      render();
  }
  if (e.target.matches("[data-photo],[data-site-photo]")) {
    const file = e.target.files[0];
    if (!file) return;
    if (
      !["image/jpeg", "image/png", "image/webp"].includes(file.type) ||
      file.size > 600000
    ) {
      notice("Choose a JPG, PNG or WebP photo up to 600 KB.");
      return;
    }
    const siteId = e.target.dataset.sitePhoto,
      jobId = e.target.dataset.photo;
    const reader = new FileReader();
    reader.onerror = () =>
      notice("Could not read that image. Please try another file.");
    reader.onload = () => {
      if (
        save((n) => {
          if (siteId)
            n.sites.find((s) => s.id === siteId).photo = reader.result;
          else {
            const j = n.jobs.find((j) => j.id === jobId);
            if (j.photos.length >= 3) throw Error("Photo limit");
            j.photos.push({
              name: file.name,
              data: reader.result,
              example: false,
            });
          }
        }, "Photo saved locally on this device.")
      )
        render();
    };
    reader.readAsDataURL(file);
  }
});
window.addEventListener("beforeunload", (e) => {
  if (dirty) {
    e.preventDefault();
    e.returnValue = "";
  }
});
window.addEventListener("storage", (e) => {
  if (e.key === KEY) {
    conflict = true;
    if (!dlg.open) render();
    notice("Another tab changed the sample. Reload before saving.");
  }
});
window.addEventListener("hashchange", () => {
  const next = location.hash.slice(1);
  if (menu().some((x) => x[0] === next)) go(next);
});
window.addEventListener("offline", () => {
  if (!dlg.open) render();
});
window.addEventListener("online", () => {
  if (!dlg.open) render();
});
setInterval(() => {
  const timer = $("#live-timer");
  if (timer) {
    const s = job(selected).sessions.find((s) => !s.out);
    if (s) timer.textContent = elapsed(s.in.time);
  }
}, 1000);
const route = location.hash.slice(1);
if (menu().some((x) => x[0] === route)) page = route;
render();
if (
  "serviceWorker" in navigator &&
  ["http:", "https:"].includes(location.protocol) &&
  location.pathname.startsWith("/three-view/")
)
  navigator.serviceWorker
    .register("./sw.js", { scope: "./" })
    .catch(() =>
      notice(
        "Offline installation is unavailable here. The clickable sample still works.",
      ),
    );
</script>
  </body>
</html>
