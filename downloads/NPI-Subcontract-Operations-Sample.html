<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#102c50" />
    <meta
      name="description"
      content="Clickable NPI Alaska field operations sample. Demonstration data only."
    />



    <title>NPI Alaska · Subcontract operations</title>
    <style>
      :root {
        --navy: #102c50;
        --blue: #185adb;
        --gold: #cfab55;
        --silver: #cbd5e1;
        --ink: #182b40;
        --muted: #52657a;
        --paper: #f3f6fa;
        --line: #d9e2ec;
        --white: #fff;
        --green: #246248;
        --red: #a42e35;
        --radius: 16px;
        --photo: url("../sample/alaska-illustration.jpg");
        font-family: "Segoe UI", Arial, sans-serif;
        color: var(--ink);
        background: var(--paper);
        font-size: 15px;
        scrollbar-color: #8495a9 var(--paper);
        scrollbar-width: auto;
        scrollbar-gutter: stable;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
      }
      button,
      a,
      input,
      select,
      textarea {
        touch-action: manipulation;
      }
      button,
      a {
        -webkit-tap-highlight-color: transparent;
      }
      button {
        cursor: pointer;
      }
      button:disabled {
        cursor: not-allowed;
        opacity: 0.55;
      }
      button:active:not(:disabled) {
        transform: translateY(1px);
      }
      button:hover:not(:disabled) {
        filter: brightness(0.96);
      }
      a {
        color: var(--blue);
      }
      :focus-visible {
        outline: 3px solid var(--blue);
        outline-offset: 4px;
      }
      h1,
      h2,
      h3,
      p {
        margin: 0;
      }
      h1,
      h2 {
        font-family: "Arial Narrow", "Segoe UI", sans-serif;
        letter-spacing: -0.035em;
      }
      h1 {
        font-size: 34px;
        line-height: 1.15;
        font-weight: 750;
      }
      h2 {
        font-size: 23px;
      }
      h3 {
        font-size: 17px;
      }
      p {
        line-height: 1.6;
      }
      small,
      .small {
        font-size: 12px;
        line-height: 1.5;
      }
      button svg,
      .icon {
        width: 20px;
        height: 20px;
        flex-shrink: 0;
      }
      svg {
        width: 20px;
        height: 20px;
        flex-shrink: 0;
        vertical-align: middle;
      }
      ::selection {
        background: #cfab5570;
      }
      ::-webkit-scrollbar {
        width: 12px;
        height: 12px;
      }
      ::-webkit-scrollbar-track {
        background: var(--paper);
      }
      ::-webkit-scrollbar-thumb {
        background: #8495a9;
        border: 3px solid var(--paper);
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: var(--muted);
      }
      .skip {
        position: absolute;
        left: 12px;
        top: -60px;
        z-index: 20;
        background: white;
        padding: 12px;
      }
      .skip:focus {
        top: 12px;
      }
      .muted {
        color: var(--muted);
      }
      .eyebrow {
        font-size: 11px;
        font-weight: 750;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .between {
        justify-content: space-between;
      }
      .wrap {
        flex-wrap: wrap;
      }
      .stack {
        display: grid;
        gap: 18px;
      }
      .gap8 {
        gap: 8px;
      }
      .mt {
        margin-top: 24px;
      }
      .mt12 {
        margin-top: 12px;
      }
      .bold {
        font-weight: 700;
      }
      .grow {
        flex: 1;
        min-width: 0;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 9px;
        min-height: 46px;
        padding: 11px 18px;
        border: 1px solid var(--line);
        background: white;
        color: var(--ink);
        border-radius: 9px;
        font-weight: 650;
        text-decoration: none;
        white-space: normal;
        text-align: center;
      }
      .primary {
        background: var(--blue);
        border-color: var(--blue);
        color: white;
      }
      .navy {
        background: var(--navy);
        border-color: var(--navy);
        color: white;
      }
      .success {
        background: var(--green);
        border-color: var(--green);
        color: white;
      }
      .danger {
        color: var(--red);
        border-color: #dfb6ba;
      }
      .quiet {
        background: transparent;
        border-color: transparent;
        color: var(--muted);
      }
      .btn.wide {
        width: 100%;
        min-height: 54px;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        border-radius: 6px;
        padding: 5px 9px;
        font-size: 11px;
        line-height: 1.3;
        font-weight: 750;
        background: #edf2f8;
        color: var(--navy);
        white-space: nowrap;
      }
      .badge.green {
        color: #20583f;
        background: #e6f3eb;
      }
      .badge.orange {
        color: #795113;
        background: #fbf1da;
      }
      .badge.blue {
        color: #1649b0;
        background: #e9f0ff;
      }
      .badge.red {
        color: #952a33;
        background: #fae9eb;
      }
      .dot {
        display: inline-block;
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: currentColor;
      }
      .panel {
        background: white;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        padding: 24px;
        min-width: 0;
      }
      .panel-title {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 20px;
      }
      .rule {
        height: 1px;
        background: var(--line);
        margin: 20px 0;
      }
      .avatar {
        width: 36px;
        height: 36px;
        flex-shrink: 0;
        display: grid;
        place-items: center;
        border-radius: 50%;
        font-size: 12px;
        font-weight: 750;
        background: #e6edf7;
        color: var(--navy);
      }
      .avatar.gold {
        background: #f4eddc;
      }
      .notice {
        background: #eef3fb;
        border: 1px solid #d5e1f4;
        color: var(--navy);
        padding: 14px 18px;
        border-radius: 10px;
        line-height: 1.55;
        font-size: 13px;
      }
      .notice.warning {
        background: #fff6df;
        border-color: #ebd69f;
        color: #6e4c0b;
      }
      .notice.error {
        background: #fae9eb;
        border-color: #dfb6ba;
        color: var(--red);
      }
      .sidebar {
        position: fixed;
        inset: 0 auto 0 0;
        width: 230px;
        background: var(--navy);
        color: white;
        padding: 28px 18px;
        display: flex;
        flex-direction: column;
        z-index: 5;
      }
      .brand {
        display: flex;
        gap: 12px;
        align-items: center;
        padding: 0 12px;
      }
      .brandmark {
        display: grid;
        place-items: center;
        width: 44px;
        height: 44px;
        flex-shrink: 0;
        border: 1px solid #cfab55a8;
        border-radius: 50%;
        color: var(--gold);
        font-size: 16px;
        font-weight: 800;
        letter-spacing: -1px;
      }
      .brandname {
        font-weight: 750;
        font-size: 16px;
        white-space: nowrap;
        letter-spacing: 0.025em;
      }
      .brand small {
        color: #becbdc;
        font-size: 10px;
        letter-spacing: 0.19em;
      }
      .navlabel {
        color: #a6b8ce;
        padding: 38px 14px 12px;
      }
      .navlinks {
        display: grid;
        gap: 6px;
      }
      .navlink {
        display: flex;
        align-items: center;
        gap: 12px;
        width: 100%;
        min-height: 50px;
        padding: 12px 14px;
        border: 0;
        border-radius: 8px;
        color: #ced9e9;
        background: transparent;
        text-align: left;
        text-decoration: none;
        font-size: 14px;
        font-weight: 550;
      }
      .navlink[aria-current="page"] {
        background: #ffffff12;
        color: white;
        box-shadow: inset 3px 0 var(--gold);
      }
      .navlink svg {
        width: 19px;
        height: 19px;
      }
      .navcount {
        margin-left: auto;
        background: #ffffff15;
        padding: 2px 7px;
        border-radius: 5px;
        font-size: 11px;
        color: white;
      }
      .sidebar-foot {
        margin-top: auto;
        padding: 18px 10px 0;
        border-top: 1px solid #ffffff20;
      }
      .sidebar-foot p {
        font-size: 12px;
        color: #a6b8ce;
      }
      .sidebar-foot .btn {
        color: #dce7f6;
        padding: 8px 0;
        min-height: 36px;
        font-size: 12px;
      }
      .shell {
        margin-left: 230px;
      }
      .topbar {
        min-height: 78px;
        background: white;
        border-bottom: 1px solid var(--line);
        padding: 14px 36px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 14px;
      }
      .crumb {
        font-size: 13px;
        color: var(--muted);
      }
      .crumb strong {
        color: var(--ink);
      }
      .top-actions {
        display: flex;
        gap: 20px;
        align-items: center;
      }
      .profile {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .profile b {
        font-size: 13px;
      }
      .profile small {
        display: block;
        color: var(--muted);
      }
      .role-switch {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--paper);
        padding: 8px;
        font-size: 12px;
        min-height: 40px;
        color: var(--navy);
        max-width: 180px;
      }
      .previewbar {
        background: #eaf0f8;
        padding: 8px 36px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        font-size: 11px;
        color: var(--navy);
      }
      .previewbar button {
        font-size: 11px;
        border: 0;
        background: transparent;
        text-decoration: underline;
        color: var(--navy);
        padding: 4px;
      }
      .main {
        padding: 30px 36px 40px;
        max-width: 1600px;
        margin: auto;
      }
      .pagehead {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 26px;
      }
      .pagehead .eyebrow {
        color: var(--muted);
        margin-bottom: 8px;
      }
      .pagehead p {
        color: var(--muted);
        margin-top: 7px;
        font-size: 14px;
      }
      .landscape {
        background:
          linear-gradient(90deg, #0b2349e8 0%, #102c5080 62%, #102c5020),
          var(--photo);
        background-size: cover;
        background-position: center 53%;
        border-radius: var(--radius);
        min-height: 180px;
        padding: 26px 30px;
        color: white;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        overflow: hidden;
      }
      .landscape h2 {
        font-size: 28px;
        letter-spacing: -0.025em;
      }
      .landscape p {
        color: #d5e3f5;
        margin-top: 8px;
        max-width: 470px;
        font-size: 13px;
      }
      .landscape .eyebrow {
        color: #ddc68b;
        margin-bottom: 10px;
      }
      .photo-note {
        font-size: 9px;
        color: #d5e3f5;
        align-self: flex-end;
        max-width: 130px;
        text-align: right;
      }
      .metrics {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 16px;
        margin: 22px 0;
      }
      .metric {
        padding: 20px 22px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: white;
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
      }
      .metric label {
        display: block;
        color: var(--muted);
        font-size: 12px;
      }
      .metric strong {
        display: block;
        font-size: 32px;
        margin-top: 9px;
        letter-spacing: -0.04em;
        font-weight: 700;
      }
      .metric small {
        color: var(--muted);
        font-size: 10px;
      }
      .metric-icon {
        background: var(--paper);
        padding: 10px;
        border-radius: 10px;
        color: var(--blue);
      }
      .metric-icon svg {
        width: 19px;
        height: 19px;
      }
      .twocol {
        display: grid;
        grid-template-columns: minmax(0, 1.7fr) minmax(260px, 1fr);
        gap: 22px;
      }
      .site-strip {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 16px;
      }
      .sitecard {
        background: white;
        border: 1px solid var(--line);
        border-radius: 13px;
        overflow: hidden;
        min-width: 0;
      }
      .sitephoto {
        height: 125px;
        background-image: var(--photo);
        background-size: cover;
        position: relative;
      }
      .sitephoto.p1 {
        background-position: left 65%;
      }
      .sitephoto.p2 {
        background-position: center 40%;
      }
      .sitephoto.p3 {
        background-position: right 65%;
      }
      .sitephoto .badge {
        position: absolute;
        left: 12px;
        top: 12px;
        background: #ffffffeb;
      }
      .sitebody {
        padding: 17px;
      }
      .sitebody h3 {
        font-size: 15px;
      }
      .sitebody p {
        font-size: 12px;
        color: var(--muted);
        margin: 5px 0 14px;
      }
      .sitebody .btn {
        min-height: 36px;
        font-size: 12px;
        padding: 7px 10px;
      }
      .sitebody small {
        font-size: 10px;
      }
      .activity {
        display: grid;
        gap: 0;
        list-style: none;
        padding: 0;
        margin: 0;
      }
      .activity li {
        display: flex;
        gap: 12px;
        padding: 15px 0;
        border-bottom: 1px solid var(--line);
      }
      .activity li:last-child {
        border: 0;
        padding-bottom: 0;
      }
      .activity p {
        font-size: 13px;
      }
      .activity small {
        font-size: 10px;
        color: var(--muted);
      }
      .timeline-dot {
        width: 9px;
        height: 9px;
        border: 2px solid #9bafc7;
        border-radius: 50%;
        margin: 6px 6px 0;
        flex-shrink: 0;
      }
      .table-wrap {
        overflow: auto;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
        text-align: left;
      }
      caption {
        text-align: left;
        font-size: 12px;
        color: var(--muted);
        padding-bottom: 14px;
      }
      th {
        padding: 12px 10px;
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--muted);
        background: #f6f8fb;
        font-weight: 650;
      }
      td {
        padding: 15px 10px;
        border-bottom: 1px solid var(--line);
      }
      tr:last-child td {
        border: 0;
      }
      td .btn {
        min-height: 34px;
        padding: 5px 10px;
        font-size: 12px;
      }
      .jobcell strong {
        display: block;
        font-size: 13px;
      }
      .jobcell small {
        color: var(--muted);
        font-size: 10px;
      }
      .toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 20px;
      }
      .chips {
        display: flex;
        gap: 5px;
        flex-wrap: wrap;
      }
      .chip {
        border: 1px solid var(--line);
        border-radius: 7px;
        background: white;
        padding: 8px 12px;
        min-height: 38px;
        font-size: 12px;
        color: var(--muted);
        font-weight: 600;
      }
      .chip[aria-pressed="true"] {
        border-color: var(--navy);
        background: var(--navy);
        color: white;
      }
      .field {
        display: grid;
        gap: 7px;
        margin-bottom: 17px;
      }
      .field label {
        font-size: 13px;
        font-weight: 650;
      }
      .field input,
      .field select,
      .field textarea {
        width: 100%;
        min-height: 47px;
        border: 1px solid #b9c8d9;
        border-radius: 8px;
        padding: 11px 12px;
        background: white;
        color: var(--ink);
      }
      .field textarea {
        min-height: 108px;
        resize: none;
        line-height: 1.5;
      }
      .field small {
        font-size: 11px;
        color: var(--muted);
      }
      .field .error-text {
        color: var(--red);
      }
      [aria-invalid="true"] {
        border-color: var(--red) !important;
      }
      .search {
        position: relative;
        max-width: 290px;
        flex: 1;
      }
      .search input {
        width: 100%;
        height: 42px;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 10px 42px 10px 14px;
      }
      .search button {
        position: absolute;
        right: 4px;
        top: 4px;
        border: 0;
        background: transparent;
        min-width: 34px;
        height: 34px;
        color: var(--muted);
      }
      .empty {
        text-align: center;
        padding: 42px 24px;
      }
      .empty p {
        color: var(--muted);
        font-size: 14px;
        margin: 10px auto 20px;
        max-width: 430px;
      }
      .worker-grid {
        display: grid;
        grid-template-columns: minmax(0, 1.5fr) minmax(280px, 1fr);
        gap: 24px;
      }
      .jobhero {
        height: 185px;
        background-image:
          linear-gradient(0deg, #0c274cdc, transparent), var(--photo);
        background-size: cover;
        background-position: center 65%;
        border-radius: 13px 13px 0 0;
        display: flex;
        align-items: flex-end;
        padding: 22px;
        color: white;
        position: relative;
      }
      .jobhero .badge {
        position: absolute;
        top: 18px;
        left: 22px;
      }
      .jobhero h2 {
        font-size: 28px;
      }
      .job-main {
        border: 1px solid var(--line);
        background: white;
        border-radius: var(--radius);
        overflow: hidden;
      }
      .job-inner {
        padding: 24px;
      }
      .job-meta {
        display: flex;
        gap: 20px;
        flex-wrap: wrap;
        margin-bottom: 22px;
      }
      .job-meta span {
        font-size: 12px;
        color: var(--muted);
      }
      .job-meta b {
        display: block;
        color: var(--ink);
        margin-top: 4px;
        font-size: 14px;
      }
      .task {
        display: flex;
        align-items: center;
        gap: 12px;
        min-height: 57px;
        padding: 13px 0;
        border-bottom: 1px solid var(--line);
        font-size: 15px;
        cursor: pointer;
        line-height: 1.4;
      }
      .task input {
        width: 22px;
        height: 22px;
        accent-color: var(--blue);
        flex-shrink: 0;
      }
      .task:has(input:checked) {
        color: var(--green);
      }
      .task:has(input:disabled) {
        cursor: default;
      }
      .tasksmall {
        font-size: 12px;
      }
      .progress {
        height: 6px;
        background: #e7edf5;
        border-radius: 4px;
        overflow: hidden;
      }
      .progress span {
        display: block;
        height: 100%;
        background: var(--blue);
      }
      .step {
        display: flex;
        gap: 14px;
        align-items: flex-start;
        padding: 15px 0;
      }
      .stepnum {
        display: grid;
        place-items: center;
        width: 30px;
        height: 30px;
        border: 1px solid var(--line);
        border-radius: 50%;
        font-size: 12px;
        font-weight: 750;
        color: var(--muted);
        flex-shrink: 0;
      }
      .step.active .stepnum {
        background: var(--blue);
        color: white;
        border-color: var(--blue);
      }
      .step p {
        font-size: 13px;
        font-weight: 650;
      }
      .step small {
        font-size: 11px;
        color: var(--muted);
      }
      .evidence {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        margin: 15px 0;
      }
      .evidence-card {
        background: var(--paper);
        padding: 15px;
        border: 1px dashed #b8c8dc;
        border-radius: 10px;
        min-height: 105px;
      }
      .evidence-card svg {
        color: var(--blue);
      }
      .evidence-card b {
        font-size: 12px;
        display: block;
        margin: 10px 0 5px;
      }
      .evidence-card .btn {
        min-height: 36px;
        padding: 6px 10px;
        font-size: 11px;
      }
      .evidence-card .badge {
        font-size: 10px;
      }
      .proof-thumb {
        height: 100px;
        border-radius: 7px;
        background-image: var(--photo);
        background-size: cover;
        margin-bottom: 10px;
      }
      .summary-line {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        padding: 12px 0;
        border-bottom: 1px solid var(--line);
        font-size: 13px;
      }
      .summary-line:last-child {
        border: 0;
      }
      .summary-line span {
        color: var(--muted);
      }
      .settings-tabs {
        display: flex;
        gap: 7px;

            n,
            `${id}: ${out ? "checkout" : "check-in"} with ${point.source}; ${roster.length} roster member(s).`,
          );
        },
        `${out ? "Checkout" : "Check-in"} recorded locally with its own location.`,
      )
    ) {
      capture = null;
      dirty = false;
      modal.close();
      render();
    }
  },
  photo: (el) => {
    if (
      save((n) => {
        n.works.find((w) => w.id === el.dataset.id).photo = true;
      }, "Sample evidence added locally.")
    )
      render();
  },
  claim: (el) => claimDialog(el.dataset.id),
  "contractor-approve": (el) => {
    const w = work(el.dataset.id);
    if (w.status !== "contractor-review" || !hasBothLocations(w)) {
      tell("A complete worker claim and both event locations are required.");
      return;
    }
    if (
      save((n) => {
        const x = n.works.find((x) => x.id === w.id);
        x.status = "npi-review";
        log(
          n,
          `${w.id}: subcontractor reviewed ${h(w.claimedHours)} h and forwarded to NPI.`,
        );
      }, "Claim forwarded to NPI. It is not yet NPI-approved.")
    )
      render();
  },
  "npi-approve": (el) => npiDialog(el.dataset.id),
  return: (el) =>
    dialog(
      "Return hours with a reason",
      `<form id="return-form" data-id="${el.dataset.id}" novalidate>${field("return-note", "What must be corrected?", "textarea", "")}<div class="dialog-actions">${btn("Cancel", "close")}<button type="submit" class="btn primary">Return claim</button></div></form>`,
    ),
  "new-invoice": () => billingForm(true),
  "new-bill": () => billingForm(false),
  "revise-bill": (el) =>
    billingForm(
      false,
      state.bills.find((b) => b.id === el.dataset.id),
    ),
  "review-bill": (el) => {
    const b = state.bills.find((b) => b.id === el.dataset.id);
    dialog(
      "Verify subcontractor bill",
      `<h3>${esc(b.reference)}</h3><p class="small muted mt12">${esc(company(b.company).name)} · ${b.workIds.join(", ")}</p><div class="summary-line"><span>Expected from approved quantities</span><b>${money(b.expected)}</b></div><div class="summary-line"><span>Subcontractor claimed</span><b>${money(b.claimed)}</b></div><div class="summary-line"><span>Difference</span><b>${money(b.claimed - b.expected)}</b></div><p class="notice ${b.claimed !== b.expected ? "warning" : ""} mt">${b.claimed !== b.expected ? "The bill does not match the agreed sample rates. Dispute it or have the contractor revise it. Approval is blocked." : "Amounts match. Confirm approved work and document details before recording approval."}</p><form id="bill-review-form" data-id="${b.id}" novalidate class="mt">${field("bill-note", "Review / dispute note", "textarea", "")}<div class="dialog-actions">${btn("Cancel", "close")}<button type="submit" name="decision" value="dispute" class="btn danger">Dispute bill</button><button type="submit" name="decision" value="approve" class="btn primary" ${b.claimed !== b.expected ? "disabled" : ""}>Approve matched bill</button></div></form>`,
    );
  },
  payment: (el) => {
    const [type, id] = el.dataset.id.split(":"),
      d = (type === "invoice" ? state.invoices : state.bills).find(
        (d) => d.id === id,
      ),
      total = type === "invoice" ? d.expected : d.claimed;
    if (type === "bill" && d.status !== "Approved") {
      tell("Only approved bills can have a payment recorded.");
      return;
    }
    if ((d.paid || 0) >= total) {
      tell("This document has no outstanding balance.");
      return;
    }
    dialog(
      type === "invoice"
        ? "Record customer receipt"
        : "Record subcontractor payment",
      `<form id="payment-form" data-type="${type}" data-id="${id}" novalidate><p class="notice">Manual record only. This does not transfer money or contact anyone.</p><p class="small mt12">Outstanding: ${money(total - (d.paid || 0))}</p><div class="mt">${field("payment-amount", "Amount (USD)", "number", (total - (d.paid || 0)) / 100)}${field("payment-reference", "Payment / receipt reference", "text", "")}</div><div class="dialog-actions">${btn("Cancel", "close")}<button type="submit" class="btn primary">Save bookkeeping entry</button></div></form>`,
    );
  },
  reset: () =>
    dialog(
      "Reset revised sample?",
      `<p>Removes only this subcontract sample’s local edits and chosen photos. Other NPI apps and spreadsheets are untouched.</p><div class="dialog-actions">${btn("Keep sample", "close", "", "primary")}${btn("Reset revised sample", "reset-confirm", "", "danger")}</div>`,
    ),
  "reset-confirm": () => {
    try {
      localStorage.removeItem(KEY);
      state = seed();
      normalize();
      conflict = false;
      dirty = false;
      modal.close();
      render();
      tell("Revised sample reset.");
    } catch {
      error("Could not reset storage.");
    }
  },
};
function submit(e) {
  e.preventDefault();
  const f = e.target,
    id = f.dataset.id,
    w = work(id),
    value = (k) => $("#" + k, f)?.value.trim() || "";
  try {
    if (f.id === "work-order-form") {
      const title = value("new-title"),
        comp = value("new-company"),
        workerId = value("new-worker"),
        customer = Math.round(Number(value("customer-rate")) * 100),
        contractor = Math.round(Number(value("contractor-rate")) * 100);
      if (!title) {
        error("Describe the work.", "new-title");
        return;
      }
      if (person(workerId).company !== comp) {
        error(
          "The assigned worker must belong to the selected subcontractor.",
          "new-worker",
        );
        return;
      }
      if (
        !/^\d{4}-\d{2}-\d{2}$/.test(value("new-date")) ||
        ![customer, contractor].every((c) => Number.isSafeInteger(c) && c >= 0)
      ) {
        error("Choose a planned date and valid nonnegative rates.");
        return;
      }
      if (
        save((n) => {
          const id =
            "WO-" +
            (Math.max(...n.works.map((w) => Number(w.id.slice(3)))) + 1);
          n.works.unshift({
            id,
            site: value("new-site"),
            company: comp,
            worker: workerId,
            title,
            date: value("new-date"),
            status: "worker-draft",
            sessions: [],
            tasks: [],
            photo: false,
            loads: 0,
            rates: {
              customer: { basis: value("customer-basis"), cents: customer },
              contractor: {
                basis: value("contractor-basis"),
                cents: contractor,
              },
            },
          });
          log(
            n,
            `${id}: assigned to ${company(comp).name} / ${person(workerId).name}.`,
          );
        }, "Subcontract assignment created locally.")
      ) {
        dirty = false;
        modal.close();
        render();
      }
    }
    if (f.id === "claim-form") {
      const by = {};
      for (const m of members(w)) {
        by[m] = Number(value("claim-" + m));
        if (!Number.isFinite(by[m]) || by[m] < 0 || by[m] > 10000) {
          error("Enter valid nonnegative hours for each worker.", "claim-" + m);
          return;
        }
      }
      const total = Object.values(by).reduce((a, b) => a + b, 0),
        reason = value("claim-reason");
      if (Math.abs(total - recordedHours(w)) > 0.0001 && !reason) {
        error(
          "Explain why claimed hours differ from recorded attendance.",
          "claim-reason",
        );
        return;
      }
      if (
        save((n) => {
          const x = n.works.find((x) => x.id === id);
          x.claimedBy = by;
          x.claimedHours = total;
          x.contractorNote = reason;
          x.status = "contractor-review";
          log(n, `${id}: worker submitted ${h(total)} claimed h.`);
        }, "Worker hours submitted to subcontractor.")
      ) {
        dirty = false;
        modal.close();
        render();
      }
    }
    if (f.id === "npi-form") {
      const by = {};
      for (const m of members(w)) {
        by[m] = Number(value("accept-" + m));
        if (!Number.isFinite(by[m]) || by[m] < 0 || by[m] > 10000) {
          error("Enter valid hours for each worker.", "accept-" + m);
          return;
        }
      }
      const total = Object.values(by).reduce((a, b) => a + b, 0),
        reason = value("accept-reason");
      if (
        Object.keys(by).some(
          (m) =>
            Math.abs(by[m] - (w.claimedBy?.[m] ?? w.claimedHours)) > 0.0001,
        ) &&
        !reason
      ) {
        error("Explain each adjustment to claimed hours.", "accept-reason");
        return;
      }
      if (overlappingWorkers(w, state.works).length)
        throw Error(
          "Overlapping attendance must be resolved before NPI approval.",
        );
      const approved = approveHours(w, total, reason);
      if (
        save((n) => {
          n.works[n.works.findIndex((x) => x.id === id)] = {
            ...approved,
            acceptedBy: by,
          };
          log(
            n,
            `${id}: NPI accepted ${h(total)} h; contractor claimed ${h(w.claimedHours)} h. ${reason}`,
          );
        }, "NPI accepted hours saved. Original events remain unchanged.")
      ) {
        dirty = false;
        modal.close();
        render();
      }
    }
    if (f.id === "return-form") {
      const note = value("return-note");
      if (!note) {
        error("Enter a clear correction reason.", "return-note");
        return;
      }
      if (
        save((n) => {
          const x = n.works.find((x) => x.id === id);
          x.status = "returned";
          x.returnReason = note;
          log(n, `${id}: returned to worker: ${note}`);
        }, "Claim returned. Resubmission must pass both review stages again.")
      ) {
        dirty = false;
        modal.close();
        render();
      }
    }
    if (f.id === "document-form") {
      const side = f.dataset.side,
        existing = state.bills.find((b) => b.id === id),
        ids = [...f.querySelectorAll("input[name=work-lines]:checked")].map(
          (x) => x.value,
        ),
        ref = value("doc-reference");
      if (!ids.length || !ref) {
        error("Select work and enter a document reference.", "doc-reference");
        return;
      }
      const all = side === "customer" ? state.invoices : state.bills;
      if (
        all.some(
          (d) => d.id !== id && d.reference.toLowerCase() === ref.toLowerCase(),
        )
      ) {
        error("That document reference already exists.", "doc-reference");
        return;
      }
      const available = existing
        ? existing.workIds
        : eligible(
            state.works.filter(
              (w) => side === "customer" || w.company === "aurora",
            ),
            all,
          ).map((w) => w.id);
      if (ids.some((x) => !available.includes(x)))
        throw Error("Work has already been allocated or is not eligible");
      const lines = ids.map((id) => ({
          id,
          cents: charge(work(id), side),
          units: quantity(work(id), work(id).rates[side].basis),
          rate: structuredClone(work(id).rates[side]),
        })),
        expected = lines.reduce((a, l) => a + l.cents, 0),
        claimed =
          side === "customer"
            ? expected
            : Math.round(Number(value("doc-claimed")) * 100);
      if (!Number.isSafeInteger(claimed) || claimed < 0) {
        error("Enter a valid claimed amount.", "doc-claimed");
        return;
      }
      if (
        save(
          (n) => {
            const doc = {
              id:
                existing?.id ||
                (side === "customer" ? "INV-" : "BILL-") + Date.now(),
              reference: ref,
              company: existing?.company || "aurora",
              workIds: ids,
              lines,
              expected,
              claimed,
              status: side === "customer" ? "Draft" : "Submitted",
              paid: 0,
            };
            if (existing) n.bills[n.bills.findIndex((b) => b.id === id)] = doc;
            else (side === "customer" ? n.invoices : n.bills).push(doc);
            log(
              n,
              `${doc.id}: ${side === "customer" ? "customer invoice draft created" : "subcontractor bill submitted"}; ${money(claimed)}.`,
            );
          },
          side === "customer"
            ? "Customer invoice draft saved; nothing sent."
            : "Subcontractor bill submitted for NPI review.",
        )
      ) {
        dirty = false;
        modal.close();
        render();
      }
    }
    if (f.id === "bill-review-form") {
      const b = state.bills.find((b) => b.id === id),
        decision = e.submitter.value,
        note = value("bill-note");
      if (decision === "approve" && b.claimed !== b.expected)
        throw Error("Mismatched bills cannot be approved");
      if (decision === "dispute" && !note) {
        error(
          "Explain the discrepancy before disputing the bill.",
          "bill-note",
        );
        return;
      }
      if (
        save(
          (n) => {
            const x = n.bills.find((b) => b.id === id);
            x.status = decision === "approve" ? "Approved" : "Disputed";
            x.reviewNote = note;
            log(n, `${id}: NPI ${x.status.toLowerCase()}. ${note}`);
          },
          decision === "approve"
            ? "Bill approved; no payment made."
            : "Bill disputed; contractor can revise it.",
        )
      ) {
        dirty = false;
        modal.close();
        render();
      }
    }
    if (f.id === "payment-form") {
      const type = f.dataset.type,
        doc = (type === "invoice" ? state.invoices : state.bills).find(
          (x) => x.id === id,
        ),
        cents = Math.round(Number(value("payment-amount")) * 100),
        reference = value("payment-reference"),
        outstanding =
          (type === "invoice" ? doc.expected : doc.claimed) - (doc.paid || 0);
      if (
        !Number.isFinite(cents) ||
        cents <= 0 ||
        cents > outstanding ||
        !reference
      ) {
        error(
          "Enter a reference and an amount above zero, no greater than the outstanding balance.",
          "payment-amount",
        );
        return;
      }
      if (
        state.payments.some(
          (p) =>
            p.type === type &&
            p.doc === id &&
            p.reference.toLowerCase() === reference.toLowerCase(),
        )
      ) {
        error(
          "That payment reference is already recorded for this document.",
          "payment-reference",
        );
        return;
      }
      if (
        save((n) => {
          const d = (type === "invoice" ? n.invoices : n.bills).find(
            (d) => d.id === id,
          );
          d.paid = (d.paid || 0) + cents;
          n.payments.push({
            type,
            doc: id,
            cents,
            reference,
            at: new Date().toISOString(),
          });
          log(
            n,
            `${id}: recorded ${money(cents)} ${type === "invoice" ? "receipt" : "payment"}, reference ${reference}.`,
          );
        }, "Bookkeeping entry saved. No money was transferred.")
      ) {
        dirty = false;
        modal.close();
        render();
      }
    }
  } catch (err) {
    error(err.message || "Check the entered values and retry.");
  }
}
function normalize() {
  for (const w of state.works) {
    if (w.claimedHours !== undefined && !w.claimedBy) {
      w.claimedBy =
        w.id === "WO-202"
          ? { alex: 3, ben: 2, lee: 2 }
          : { [w.worker]: w.claimedHours };
    }
    if (w.acceptedHours !== undefined && !w.acceptedBy)
      w.acceptedBy = { [w.worker]: w.acceptedHours };
  }
}
function onClick(e) {
  const el = e.target.closest("[data-a]");
  if (el && !el.disabled) {
    e.preventDefault();
    actions[el.dataset.a]?.(el);
  }
  const link = e.target.closest('a[href^="#"]');
  if (link && link.hash !== "#main") {
    e.preventDefault();
    const next = link.hash.slice(1);
    if (allowed().includes(next)) {
      view = next;
      history.replaceState(null, "", "#" + next);
      render();
      window.scrollTo(0, 0);
      $("#page-title")?.focus();
    }
  }
}
app.addEventListener("click", onClick);
modal.addEventListener("click", onClick);
modal.addEventListener("submit", submit);
modal.addEventListener("input", (e) => {
  if (e.target.closest("form")) dirty = true;
});
modal.addEventListener("cancel", (e) => {
  e.preventDefault();
  actions.close();
});
modal.addEventListener("change", (e) => {
  if (e.target.id === "entry-mode")
    $("#roster").hidden = e.target.value !== "crew";
});
app.addEventListener("change", async (e) => {
  if (e.target.id === "hours-date") {
    dateFilter = e.target.value;
    render();
  }
  if (e.target.id === "hours-site") {
    siteFilter = e.target.value;
    render();
  }
  if (e.target.id === "worker-work") {
    chosen = e.target.value;
    render();
  }
  if (e.target.id === "preview-role") {
    role = e.target.value;
    view =
      role === "Worker"
        ? "worker"
        : role === "NPI supervisor"
          ? "approvals"
          : "overview";
    history.replaceState(null, "", "#" + view);
    render();
    window.scrollTo(0, 0);
  }
  if (e.target.matches("[data-task]")) {
    const w = work(chosen),
      i = Number(e.target.dataset.task);
    if (
      save((n) => {
        const x = n.works.find((x) => x.id === w.id);
        x.tasks = e.target.checked
          ? [...new Set([...x.tasks, i])]
          : x.tasks.filter((k) => k !== i);
      }, "Checklist saved locally.")
    )
      render();
  }
  if (e.target.matches("[data-site-photo]")) {
    const file = e.target.files[0];
    if (!file) return;
    if (
      !["image/jpeg", "image/png", "image/webp"].includes(file.type) ||
      file.size > 600000
    ) {
      tell("Choose a JPG, PNG or WebP image up to 600 KB.");
      return;
    }
    const reader = new FileReader();
    reader.onerror = () => tell("Could not read the photo. Try another file.");
    reader.onload = () => {
      if (
        save((n) => {
          n.sites.find((s) => s.id === e.target.dataset.sitePhoto).photo =
            reader.result;
        }, "Actual site photo saved only on this device.")
      )
        render();
    };
    reader.readAsDataURL(file);
  }
});
window.addEventListener("beforeunload", (e) => {
  if (dirty) {
    e.preventDefault();
    e.returnValue = "";
  }
});
window.addEventListener("storage", (e) => {
  if (e.key === KEY) {
    conflict = true;
    if (!modal.open) render();
    tell("Another tab changed this sample. Reload before saving.");
  }
});
window.addEventListener("hashchange", () => {
  const next = location.hash.slice(1);
  if (allowed().includes(next)) {
    view = next;
    render();
  }
});
setInterval(() => {
  const timer = $("#live-timer");
  if (timer) {
    const open = work(chosen).sessions.find((s) => !s.out);
    if (open) timer.textContent = running(open.in.time);
  }
}, 1000);
normalize();
const initial = location.hash.slice(1);
if (allowed().includes(initial)) view = initial;
render();
if (
  "serviceWorker" in navigator &&
  ["http:", "https:"].includes(location.protocol) &&
  location.pathname.startsWith("/operations/")
)
  navigator.serviceWorker
    .register("./sw.js", { scope: "./" })
    .catch(() =>
      tell("Offline install is unavailable here; the sample remains usable."),
    );
</script>
