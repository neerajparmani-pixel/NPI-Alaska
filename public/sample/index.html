<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#102c50" />
    <meta
      name="description"
      content="Clickable NPI Alaska field operations sample. Demonstration data only."
    />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <title>NPI Alaska · Operations sample</title>
    <style>
      :root {
        --navy: #102c50;
        --blue: #185adb;
        --gold: #cfab55;
        --silver: #cbd5e1;
        --ink: #182b40;
        --muted: #52657a;
        --paper: #f3f6fa;
        --line: #d9e2ec;
        --white: #fff;
        --green: #246248;
        --red: #a42e35;
        --radius: 16px;
        --photo: url("./alaska-illustration.jpg");
        font-family: "Segoe UI", Arial, sans-serif;
        color: var(--ink);
        background: var(--paper);
        font-size: 15px;
        scrollbar-color: #8495a9 var(--paper);
        scrollbar-width: auto;
        scrollbar-gutter: stable;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
      }
      button,
      a,
      input,
      select,
      textarea {
        touch-action: manipulation;
      }
      button,
      a {
        -webkit-tap-highlight-color: transparent;
      }
      button {
        cursor: pointer;
      }
      button:disabled {
        cursor: not-allowed;
        opacity: 0.55;
      }
      button:active:not(:disabled) {
        transform: translateY(1px);
      }
      button:hover:not(:disabled) {
        filter: brightness(0.96);
      }
      a {
        color: var(--blue);
      }
      :focus-visible {
        outline: 3px solid var(--blue);
        outline-offset: 4px;
      }
      h1,
      h2,
      h3,
      p {
        margin: 0;
      }
      h1,
      h2 {
        font-family: "Arial Narrow", "Segoe UI", sans-serif;
        letter-spacing: -0.035em;
      }
      h1 {
        font-size: 34px;
        line-height: 1.15;
        font-weight: 750;
      }
      h2 {
        font-size: 23px;
      }
      h3 {
        font-size: 17px;
      }
      p {
        line-height: 1.6;
      }
      small,
      .small {
        font-size: 12px;
        line-height: 1.5;
      }
      button svg,
      .icon {
        width: 20px;
        height: 20px;
        flex-shrink: 0;
      }
      svg {
        width: 20px;
        height: 20px;
        flex-shrink: 0;
        vertical-align: middle;
      }
      ::selection {
        background: #cfab5570;
      }
      ::-webkit-scrollbar {
        width: 12px;
        height: 12px;
      }
      ::-webkit-scrollbar-track {
        background: var(--paper);
      }
      ::-webkit-scrollbar-thumb {
        background: #8495a9;
        border: 3px solid var(--paper);
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: var(--muted);
      }
      .skip {
        position: absolute;
        left: 12px;
        top: -60px;
        z-index: 20;
        background: white;
        padding: 12px;
      }
      .skip:focus {
        top: 12px;
      }
      .muted {
        color: var(--muted);
      }
      .eyebrow {
        font-size: 11px;
        font-weight: 750;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .between {
        justify-content: space-between;
      }
      .wrap {
        flex-wrap: wrap;
      }
      .stack {
        display: grid;
        gap: 18px;
      }
      .gap8 {
        gap: 8px;
      }
      .mt {
        margin-top: 24px;
      }
      .mt12 {
        margin-top: 12px;
      }
      .bold {
        font-weight: 700;
      }
      .grow {
        flex: 1;
        min-width: 0;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 9px;
        min-height: 46px;
        padding: 11px 18px;
        border: 1px solid var(--line);
        background: white;
        color: var(--ink);
        border-radius: 9px;
        font-weight: 650;
        text-decoration: none;
        white-space: normal;
        text-align: center;
      }
      .primary {
        background: var(--blue);
        border-color: var(--blue);
        color: white;
      }
      .navy {
        background: var(--navy);
        border-color: var(--navy);
        color: white;
      }
      .success {
        background: var(--green);
        border-color: var(--green);
        color: white;
      }
      .danger {
        color: var(--red);
        border-color: #dfb6ba;
      }
      .quiet {
        background: transparent;
        border-color: transparent;
        color: var(--muted);
      }
      .btn.wide {
        width: 100%;
        min-height: 54px;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        border-radius: 6px;
        padding: 5px 9px;
        font-size: 11px;
        line-height: 1.3;
        font-weight: 750;
        background: #edf2f8;
        color: var(--navy);
        white-space: nowrap;
      }
      .badge.green {
        color: #20583f;
        background: #e6f3eb;
      }
      .badge.orange {
        color: #795113;
        background: #fbf1da;
      }
      .badge.blue {
        color: #1649b0;
        background: #e9f0ff;
      }
      .badge.red {
        color: #952a33;
        background: #fae9eb;
      }
      .dot {
        display: inline-block;
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: currentColor;
      }
      .panel {
        background: white;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        padding: 24px;
        min-width: 0;
      }
      .panel-title {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 20px;
      }
      .rule {
        height: 1px;
        background: var(--line);
        margin: 20px 0;
      }
      .avatar {
        width: 36px;
        height: 36px;
        flex-shrink: 0;
        display: grid;
        place-items: center;
        border-radius: 50%;
        font-size: 12px;
        font-weight: 750;
        background: #e6edf7;
        color: var(--navy);
      }
      .avatar.gold {
        background: #f4eddc;
      }
      .notice {
        background: #eef3fb;
        border: 1px solid #d5e1f4;
        color: var(--navy);
        padding: 14px 18px;
        border-radius: 10px;
        line-height: 1.55;
        font-size: 13px;
      }
      .notice.warning {
        background: #fff6df;
        border-color: #ebd69f;
        color: #6e4c0b;
      }
      .notice.error {
        background: #fae9eb;
        border-color: #dfb6ba;
        color: var(--red);
      }
      .sidebar {
        position: fixed;
        inset: 0 auto 0 0;
        width: 230px;
        background: var(--navy);
        color: white;
        padding: 28px 18px;
        display: flex;
        flex-direction: column;
        z-index: 5;
      }
      .brand {
        display: flex;
        gap: 12px;
        align-items: center;
        padding: 0 12px;
      }
      .brandmark {
        display: grid;
        place-items: center;
        width: 44px;
        height: 44px;
        flex-shrink: 0;
        border: 1px solid #cfab55a8;
        border-radius: 50%;
        color: var(--gold);
        font-size: 16px;
        font-weight: 800;
        letter-spacing: -1px;
      }
      .brandname {
        font-weight: 750;
        font-size: 16px;
        white-space: nowrap;
        letter-spacing: 0.025em;
      }
      .brand small {
        color: #becbdc;
        font-size: 10px;
        letter-spacing: 0.19em;
      }
      .navlabel {
        color: #a6b8ce;
        padding: 38px 14px 12px;
      }
      .navlinks {
        display: grid;
        gap: 6px;
      }
      .navlink {
        display: flex;
        align-items: center;
        gap: 12px;
        width: 100%;
        min-height: 50px;
        padding: 12px 14px;
        border: 0;
        border-radius: 8px;
        color: #ced9e9;
        background: transparent;
        text-align: left;
        text-decoration: none;
        font-size: 14px;
        font-weight: 550;
      }
      .navlink[aria-current="page"] {
        background: #ffffff12;
        color: white;
        box-shadow: inset 3px 0 var(--gold);
      }
      .navlink svg {
        width: 19px;
        height: 19px;
      }
      .navcount {
        margin-left: auto;
        background: #ffffff15;
        padding: 2px 7px;
        border-radius: 5px;
        font-size: 11px;
        color: white;
      }
      .sidebar-foot {
        margin-top: auto;
        padding: 18px 10px 0;
        border-top: 1px solid #ffffff20;
      }
      .sidebar-foot p {
        font-size: 12px;
        color: #a6b8ce;
      }
      .sidebar-foot .btn {
        color: #dce7f6;
        padding: 8px 0;
        min-height: 36px;
        font-size: 12px;
      }
      .shell {
        margin-left: 230px;
      }
      .topbar {
        min-height: 78px;
        background: white;
        border-bottom: 1px solid var(--line);
        padding: 14px 36px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 14px;
      }
      .crumb {
        font-size: 13px;
        color: var(--muted);
      }
      .crumb strong {
        color: var(--ink);
      }
      .top-actions {
        display: flex;
        gap: 20px;
        align-items: center;
      }
      .profile {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .profile b {
        font-size: 13px;
      }
      .profile small {
        display: block;
        color: var(--muted);
      }
      .role-switch {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--paper);
        padding: 8px;
        font-size: 12px;
        min-height: 40px;
        color: var(--navy);
        max-width: 180px;
      }
      .previewbar {
        background: #eaf0f8;
        padding: 8px 36px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        font-size: 11px;
        color: var(--navy);
      }
      .previewbar button {
        font-size: 11px;
        border: 0;
        background: transparent;
        text-decoration: underline;
        color: var(--navy);
        padding: 4px;
      }
      .main {
        padding: 30px 36px 40px;
        max-width: 1600px;
        margin: auto;
      }
      .pagehead {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 26px;
      }
      .pagehead .eyebrow {
        color: var(--muted);
        margin-bottom: 8px;
      }
      .pagehead p {
        color: var(--muted);
        margin-top: 7px;
        font-size: 14px;
      }
      .landscape {
        background:
          linear-gradient(90deg, #0b2349e8 0%, #102c5080 62%, #102c5020),
          var(--photo);
        background-size: cover;
        background-position: center 53%;
        border-radius: var(--radius);
        min-height: 180px;
        padding: 26px 30px;
        color: white;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        overflow: hidden;
      }
      .landscape h2 {
        font-size: 28px;
        letter-spacing: -0.025em;
      }
      .landscape p {
        color: #d5e3f5;
        margin-top: 8px;
        max-width: 470px;
        font-size: 13px;
      }
      .landscape .eyebrow {
        color: #ddc68b;
        margin-bottom: 10px;
      }
      .photo-note {
        font-size: 9px;
        color: #d5e3f5;
        align-self: flex-end;
        max-width: 130px;
        text-align: right;
      }
      .metrics {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 16px;
        margin: 22px 0;
      }
      .metric {
        padding: 20px 22px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: white;
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
      }
      .metric label {
        display: block;
        color: var(--muted);
        font-size: 12px;
      }
      .metric strong {
        display: block;
        font-size: 32px;
        margin-top: 9px;
        letter-spacing: -0.04em;
        font-weight: 700;
      }
      .metric small {
        color: var(--muted);
        font-size: 10px;
      }
      .metric-icon {
        background: var(--paper);
        padding: 10px;
        border-radius: 10px;
        color: var(--blue);
      }
      .metric-icon svg {
        width: 19px;
        height: 19px;
      }
      .twocol {
        display: grid;
        grid-template-columns: minmax(0, 1.7fr) minmax(260px, 1fr);
        gap: 22px;
      }
      .site-strip {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 16px;
      }
      .sitecard {
        background: white;
        border: 1px solid var(--line);
        border-radius: 13px;
        overflow: hidden;
        min-width: 0;
      }
      .sitephoto {
        height: 125px;
        background-image: var(--photo);
        background-size: cover;
        position: relative;
      }
      .sitephoto.p1 {
        background-position: left 65%;
      }
      .sitephoto.p2 {
        background-position: center 40%;
      }
      .sitephoto.p3 {
        background-position: right 65%;
      }
      .sitephoto .badge {
        position: absolute;
        left: 12px;
        top: 12px;
        background: #ffffffeb;
      }
      .sitebody {
        padding: 17px;
      }
      .sitebody h3 {
        font-size: 15px;
      }
      .sitebody p {
        font-size: 12px;
        color: var(--muted);
        margin: 5px 0 14px;
      }
      .sitebody .btn {
        min-height: 36px;
        font-size: 12px;
        padding: 7px 10px;
      }
      .sitebody small {
        font-size: 10px;
      }
      .activity {
        display: grid;
        gap: 0;
        list-style: none;
        padding: 0;
        margin: 0;
      }
      .activity li {
        display: flex;
        gap: 12px;
        padding: 15px 0;
        border-bottom: 1px solid var(--line);
      }
      .activity li:last-child {
        border: 0;
        padding-bottom: 0;
      }
      .activity p {
        font-size: 13px;
      }
      .activity small {
        font-size: 10px;
        color: var(--muted);
      }
      .timeline-dot {
        width: 9px;
        height: 9px;
        border: 2px solid #9bafc7;
        border-radius: 50%;
        margin: 6px 6px 0;
        flex-shrink: 0;
      }
      .table-wrap {
        overflow: auto;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
        text-align: left;
      }
      caption {
        text-align: left;
        font-size: 12px;
        color: var(--muted);
        padding-bottom: 14px;
      }
      th {
        padding: 12px 10px;
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--muted);
        background: #f6f8fb;
        font-weight: 650;
      }
      td {
        padding: 15px 10px;
        border-bottom: 1px solid var(--line);
      }
      tr:last-child td {
        border: 0;
      }
      td .btn {
        min-height: 34px;
        padding: 5px 10px;
        font-size: 12px;
      }
      .jobcell strong {
        display: block;
        font-size: 13px;
      }
      .jobcell small {
        color: var(--muted);
        font-size: 10px;
      }
      .toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 20px;
      }
      .chips {
        display: flex;
        gap: 5px;
        flex-wrap: wrap;
      }
      .chip {
        border: 1px solid var(--line);
        border-radius: 7px;
        background: white;
        padding: 8px 12px;
        min-height: 38px;
        font-size: 12px;
        color: var(--muted);
        font-weight: 600;
      }
      .chip[aria-pressed="true"] {
        border-color: var(--navy);
        background: var(--navy);
        color: white;
      }
      .field {
        display: grid;
        gap: 7px;
        margin-bottom: 17px;
      }
      .field label {
        font-size: 13px;
        font-weight: 650;
      }
      .field input,
      .field select,
      .field textarea {
        width: 100%;
        min-height: 47px;
        border: 1px solid #b9c8d9;
        border-radius: 8px;
        padding: 11px 12px;
        background: white;
        color: var(--ink);
      }
      .field textarea {
        min-height: 108px;
        resize: none;
        line-height: 1.5;
      }
      .field small {
        font-size: 11px;
        color: var(--muted);
      }
      .field .error-text {
        color: var(--red);
      }
      [aria-invalid="true"] {
        border-color: var(--red) !important;
      }
      .search {
        position: relative;
        max-width: 290px;
        flex: 1;
      }
      .search input {
        width: 100%;
        height: 42px;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 10px 42px 10px 14px;
      }
      .search button {
        position: absolute;
        right: 4px;
        top: 4px;
        border: 0;
        background: transparent;
        min-width: 34px;
        height: 34px;
        color: var(--muted);
      }
      .empty {
        text-align: center;
        padding: 42px 24px;
      }
      .empty p {
        color: var(--muted);
        font-size: 14px;
        margin: 10px auto 20px;
        max-width: 430px;
      }
      .worker-grid {
        display: grid;
        grid-template-columns: minmax(0, 1.5fr) minmax(280px, 1fr);
        gap: 24px;
      }
      .jobhero {
        height: 185px;
        background-image:
          linear-gradient(0deg, #0c274cdc, transparent), var(--photo);
        background-size: cover;
        background-position: center 65%;
        border-radius: 13px 13px 0 0;
        display: flex;
        align-items: flex-end;
        padding: 22px;
        color: white;
        position: relative;
      }
      .jobhero .badge {
        position: absolute;
        top: 18px;
        left: 22px;
      }
      .jobhero h2 {
        font-size: 28px;
      }
      .job-main {
        border: 1px solid var(--line);
        background: white;
        border-radius: var(--radius);
        overflow: hidden;
      }
      .job-inner {
        padding: 24px;
      }
      .job-meta {
        display: flex;
        gap: 20px;
        flex-wrap: wrap;
        margin-bottom: 22px;
      }
      .job-meta span {
        font-size: 12px;
        color: var(--muted);
      }
      .job-meta b {
        display: block;
        color: var(--ink);
        margin-top: 4px;
        font-size: 14px;
      }
      .task {
        display: flex;
        align-items: center;
        gap: 12px;
        min-height: 57px;
        padding: 13px 0;
        border-bottom: 1px solid var(--line);
        font-size: 15px;
        cursor: pointer;
        line-height: 1.4;
      }
      .task input {
        width: 22px;
        height: 22px;
        accent-color: var(--blue);
        flex-shrink: 0;
      }
      .task:has(input:checked) {
        color: var(--green);
      }
      .task:has(input:disabled) {
        cursor: default;
      }
      .tasksmall {
        font-size: 12px;
      }
      .progress {
        height: 6px;
        background: #e7edf5;
        border-radius: 4px;
        overflow: hidden;
      }
      .progress span {
        display: block;
        height: 100%;
        background: var(--blue);
      }
      .step {
        display: flex;
        gap: 14px;
        align-items: flex-start;
        padding: 15px 0;
      }
      .stepnum {
        display: grid;
        place-items: center;
        width: 30px;
        height: 30px;
        border: 1px solid var(--line);
        border-radius: 50%;
        font-size: 12px;
        font-weight: 750;
        color: var(--muted);
        flex-shrink: 0;
      }
      .step.active .stepnum {
        background: var(--blue);
        color: white;
        border-color: var(--blue);
      }
      .step p {
        font-size: 13px;
        font-weight: 650;
      }
      .step small {
        font-size: 11px;
        color: var(--muted);
      }
      .evidence {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        margin: 15px 0;
      }
      .evidence-card {
        background: var(--paper);
        padding: 15px;
        border: 1px dashed #b8c8dc;
        border-radius: 10px;
        min-height: 105px;
      }
      .evidence-card svg {
        color: var(--blue);
      }
      .evidence-card b {
        font-size: 12px;
        display: block;
        margin: 10px 0 5px;
      }
      .evidence-card .btn {
        min-height: 36px;
        padding: 6px 10px;
        font-size: 11px;
      }
      .evidence-card .badge {
        font-size: 10px;
      }
      .proof-thumb {
        height: 100px;
        border-radius: 7px;
        background-image: var(--photo);
        background-size: cover;
        margin-bottom: 10px;
      }
      .summary-line {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        padding: 12px 0;
        border-bottom: 1px solid var(--line);
        font-size: 13px;
      }
      .summary-line:last-child {
        border: 0;
      }
